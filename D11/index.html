<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bölüm 1: Pazarlama İletişimine Giriş — Sesli Ders</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c14;--bg2:#0d1220;--bg3:#131927;--gb:rgba(255,255,255,.08);--text:#e8eaf0;--muted:#6b7280;--acc:#3b82f6;--accl:rgba(59,130,246,.15)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh;max-width:1100px;margin:0 auto;width:100%}
/* START OVERLAY */
.start-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .3s ease}
.start-title{font-size:2.4rem;font-weight:900;letter-spacing:-1px;margin-bottom:12px;color:var(--text)}
.start-desc{font-size:1.1rem;color:var(--muted);margin-bottom:40px;max-width:500px;line-height:1.5}
.start-btn{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;padding:18px 48px;font-size:1.2rem;font-weight:700;border-radius:100px;cursor:pointer;box-shadow:0 12px 32px rgba(59,130,246,.4);transition:transform 0.2s,box-shadow 0.2s;display:inline-flex;align-items:center;gap:12px}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(59,130,246,.5)}
/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--gb);overflow-y:auto;padding:24px 0}
.sidebar-title{padding:0 20px 16px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.ch-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 20px;color:var(--muted);cursor:pointer;font-size:.82rem;transition:.2s;border-left:3px solid transparent}
.ch-btn:hover{background:var(--accl);color:var(--text)}
.ch-btn.active{color:var(--acc);border-left-color:var(--acc);background:var(--accl);font-weight:600}
.chunk-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 20px 7px 32px;color:var(--muted);cursor:pointer;font-size:.76rem;transition:.2s;border-left:3px solid transparent}
.chunk-btn:hover{color:var(--text);background:rgba(255,255,255,.03)}
.chunk-btn.active{color:#93c5fd;border-left-color:#93c5fd}
/* MAIN PLAYER */
.player-main{display:flex;flex-direction:column;padding:40px}
.course-tag{font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.course-title{font-size:2rem;font-weight:800;letter-spacing:-1.5px;margin-bottom:24px;line-height:1.2}
/* NOW PLAYING CARD */
.now-card{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:18px;padding:32px;margin-bottom:28px;flex:1}
.np-label{font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#60a5fa;margin-bottom:10px}
.np-chap{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.np-chunk{font-size:.85rem;color:var(--muted);margin-bottom:20px}
.np-text{font-size:.9rem;color:#9ca3af;line-height:1.8;max-height:180px;overflow-y:auto;padding-right:8px}
.np-text::-webkit-scrollbar{width:4px}
.np-text::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
/* PROGRESS */
.prog-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin:20px 0 10px;cursor:pointer;position:relative}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#7c3aed);transition:width .5s linear}
.prog-times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:20px}
/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:center;gap:16px}
.ctrl-btn{background:rgba(255,255,255,.06);border:1px solid var(--gb);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text);transition:.2s}
.ctrl-btn:hover{background:rgba(255,255,255,.12);transform:scale(1.08)}
.ctrl-btn:active{transform:scale(.95)}
.play-btn{width:60px;height:60px;font-size:22px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;box-shadow:0 8px 24px rgba(59,130,246,.35)}
.play-btn:hover{box-shadow:0 12px 32px rgba(59,130,246,.5)}
.speed-btn{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:#93c5fd;font-size:.75rem;font-weight:600;border-radius:8px;padding:6px 12px;cursor:pointer;transition:.2s}
.speed-btn:hover{background:rgba(59,130,246,.2)}
.auto-btn{background:var(--bg3);border:1px solid var(--gb);color:var(--muted);font-size:.75rem;font-weight:600;border-radius:8px;padding:6px 12px;cursor:pointer;transition:.2s}
.auto-btn.active{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#34d399}
/* STATUS */
.status-bar{margin-top:20px;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);background:var(--bg3);border-radius:8px;padding:10px 14px;border:1px solid var(--gb)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--gb);max-height:220px}.player-main{padding:20px}}
</style></head>
<body>
<div id="startOverlay" class="start-overlay">
  <div class="start-title">Dersiniz Hazır 🎧</div>
  <div class="start-desc" id="startCourseTitle"></div>
  <button class="start-btn" onclick="startCourse()">▶ Dinlemeye Başla</button>
</div>
<div class="app">
<div class="sidebar">
  <div class="sidebar-title">İçindekiler</div>
  <div id="toc"></div>
</div>
<div class="player-main">
  <div class="course-tag">Sesli Ders</div>
  <div class="course-title" id="courseTitle"></div>
  <div class="now-card">
    <div class="np-label">▶ Şu An Oynatılıyor</div>
    <div class="np-chap" id="npChap">—</div>
    <div class="np-chunk" id="npChunk">—</div>
    <div class="np-text" id="npText"></div>
    <div class="prog-bar" id="progBar" onclick="seekAudio(event)">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>
    <div class="prog-times"><span id="pCurr">0:00</span><span id="pDur">0:00</span></div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipTime(-10)" title="-10s">⏪</button>
      <button class="ctrl-btn" onclick="prevChunk()" title="Önceki">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextChunk()" title="Sonraki">⏭</button>
      <button class="ctrl-btn" onclick="skipTime(10)" title="+10s">⏩</button>
      <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()">1.0×</button>
      <button class="auto-btn active" id="autoBtn" onclick="toggleAuto()" title="Otomatik Geçiş">🔁 Oto-Geçiş</button>
    </div>
    <div class="status-bar"><div class="status-dot"></div><span id="statusTxt">Oynatmaya başlamak için ▶ tuşuna basın</span></div>
  </div>
</div>
</div>
<script>
const DATA={"course_title":"Bölüm 1: Pazarlama İletişimine Giriş","chapters":[{"id":1,"title":"İletişim Kavramı ve Süreci","chunks":[{"id":"ch1_p1","title":"Giriş","text":"Dünya üzerindeki tüm canlılar gibi, örgütler, kurumlar ve işletmeler de birbirleriyle ve bireylerle iletişim halindedir . Yalnızca özel işletmeler değil, kâr amacı gütmeyen kurumlar da markalarının bilinirliği ve hatırlanması için pazarlama iletişimi faaliyetlerinde bulunurlar .","audio_file":"ch1_p1.wav"},{"id":"ch1_p2","title":"İletişim Kavramı","text":"İnsanlık tarihi kadar eski olan iletişim, kişi ve kurumların kendilerini ifade etme şekli olup anlaşılabilir mesajların alınıp gönderilmesi sanatıdır . Kaynak ile alıcı arasında belli bir konu etrafında düşünce birliği sağlama sürecidir .","audio_file":"ch1_p2.wav"},{"id":"ch1_p3","title":"İletişim Süreci","text":"İletişim süreci, mesajın oluşturulmasından alıcının bu mesajı yorumlamasına ve tepki vermesine kadar geçen birbiriyle bağlantılı çok sayıda unsuru içerir .","audio_file":"ch1_p3.wav"},{"id":"ch1_p4","title":"Gönderen (Kaynak)","text":"İletişim sürecinde bilgi, fikir veya sunulan ürünü paylaşmak üzere mesajı başlatan kişi veya kurumlardır . Kaynağın ikna ediciliği, alıcı kitle tarafından güvenilir, uzman bulunmasına veya alıcının onunla kendini özdeşleştirebilmesine bağlıdır .","audio_file":"ch1_p4.wav"},{"id":"ch1_p5","title":"Kodlama ve Mesaj","text":"Kaynağın sahip olduğu düşünce ve fikirleri kelimeler, sesler ve görsel unsurlar aracılığıyla sembolleştirmesi işlemi kodlamadır . Mesajın, alıcının anlayacağı dilde şekillendirilmesi ve içerik olarak rasyonel, duygusal ya da ahlaki çekicilik unsurlarıyla doğru bir şekilde tasarlanması gerekir .","audio_file":"ch1_p5.wav"},{"id":"ch1_p6","title":"Kanal","text":"Mesajın kaynaktan alıcıya ulaşmak için kullandığı yoldur . TV, radyo, gazete gibi kişisel olmayan kitle iletişim mecralarının yanı sıra sosyal medya, e-posta veya satış temsilcileri aracılığıyla gerçekleşen doğrudan, kişisel kanallar şeklinde ikiye ayrılır .","audio_file":"ch1_p6.wav"},{"id":"ch1_p7","title":"Alıcı ve Çözümleme","text":"Alıcı, gönderenin mesajını paylaştığı kişi veya gruplardır . Çözümleme ise alıcının geçmiş deneyimleri, beklentileri ve değerleri yardımıyla kaynağın kodladığı bu mesaja anlam yüklemesidir .","audio_file":"ch1_p7.wav"},{"id":"ch1_p8","title":"Tepki ve Geri Bildirim","text":"Alıcının mesajı aldıktan sonra oluşan gözlenebilen veya gözlenemeyen tüm reaksiyonları tepkidir . Geri bildirim ise kaynağın, mesajın arzu edilen amaca ulaşıp ulaşmadığını kontrol etmesini ve iletişimin yönünü değerlendirmesini sağlayan bir araçtır .","audio_file":"ch1_p8.wav"},{"id":"ch1_p9","title":"Gürültü","text":"Geri bildirimin kalitesini düşüren, mesajın gerçek anlamından saptırılarak yanlış algılanmasına veya bozulmasına neden olan fiziksel veya kavramsal her türlü planlanmamış unsurdur .","audio_file":"ch1_p9.wav"}]},{"id":2,"title":"Pazarlama İletişimi ve Karması","chunks":[{"id":"ch2_p1","title":"Pazarlama İletişimi ve Unsurları","text":"Tüketicilerin ihtiyaçları ile pazarlama faaliyetleri arasında gerçekleşen değişim ilişkilerinde iletişim hayati bir rol oynar . İşletmenin varlığından haberdar etme, rakiplerden farklılaşma, bilgi verme, ikna etme ve marka imajı yaratma gibi temel işlevleri vardır . Pazarlama iletişiminin kendi içerisinde bir karması bulunur .","audio_file":"ch2_p1.wav"},{"id":"ch2_p2","title":"Pazarlama İletişimi Karması Elemanları","text":"İşletmeler bütçelerine, ürün tipine, hedef kitlenin medya alışkanlıklarına ve benimsedikleri dağıtım stratejilerine göre bu karma elemanları arasından tercih yaparlar .","audio_file":"ch2_p2.wav"},{"id":"ch2_p3","title":"Reklam","text":"Belirli bir kuruluşun, iletişim araçlarını kullanarak ve bedelini ödeyerek geniş kitlelere seslendiği bilgilendirme, ikna etme ve hatırlatma işlevleri olan bir tutundurma aracıdır .","audio_file":"ch2_p3.wav"},{"id":"ch2_p4","title":"Kişisel Satış","text":"Özellikle endüstriyel pazarlarda kullanılan, alıcı ve satıcı arasında yüz yüze ve uzun dönemli ilişki geliştirmeyi amaçlayan yüksek maliyetli ve çok aşamalı bir diyalog geliştirme sürecidir .","audio_file":"ch2_p4.wav"},{"id":"ch2_p5","title":"Halkla İlişkiler","text":"Kurum ile hedef kitle (kamuoyu, ortaklar, medya) arasında iyi niyetli, stratejik ilişki geliştirmeyi amaçlar . Marka imajı yaratmada ve kriz dönemlerinde önemli bir faaliyettir .","audio_file":"ch2_p5.wav"},{"id":"ch2_p6","title":"Satış Tutundurma","text":"Ürün satışını kısa vadeli desteklemek üzere tüketicilere (kupon, yarışma, numune, indirim) veya aracılara (ticari ödenekler, bayi toplantıları) sunulan özendiricilerin bütünüdür .","audio_file":"ch2_p6.wav"},{"id":"ch2_p7","title":"Doğrudan Pazarlama","text":"Broşür, telefon, mektup, katalog, çevrimiçi veya mobil kanallar gibi araçlarla tüketicilerle birebir ilişki kurup doğrudan ve ölçülebilir geri dönüş almayı sağlayan ve müşteri sadakatini destekleyen iletişim türüdür .","audio_file":"ch2_p7.wav"},{"id":"ch2_p8","title":"Sponsorluk","text":"İşletmelerin görünürlüğünü artırmak, rakiplerden farklılaşmak ve imaj geliştirmek için belirli bir faaliyete (etkinlik, yayın vb.) nakdi veya ayni fayda sağlamasıdır .","audio_file":"ch2_p8.wav"},{"id":"ch2_p9","title":"Sergi ve Fuarlar","text":"İşletmelerin ve tüketicilerin satış baskısı olmaksızın yüz yüze geldiği, hedef kitlenin ihtiyaç ve beklentilerinin anlaşıldığı, çift yönlü ağ imkanı tanıyan organizasyonlardır .","audio_file":"ch2_p9.wav"}]},{"id":3,"title":"Marka ve Toplum ile İlişkiler","chunks":[{"id":"ch3_p1","title":"Pazarlama İletişimi ve Marka","text":"Günümüzün yoğun rekabet ortamında markalar, tüketicinin seçim yapmasını kolaylaştıran en güçlü referans noktalarıdır . Marka ismi, ürünün faydaları hakkında ipucu veren, kolay telaffuz edilen ve akılda kalıcı olması gereken en önemli sözel tutundurma aracıdır . Markayı muadillerinden ayıran logolar, amblemler ile iletişim aracı işlevi gören ambalaj tasarımı ve etiketler de satın alma kararını doğrudan etkiler . Kurum kimliğini güçlendiren marka sloganları ve ünlü kişilerden veya yaratılmış kurgulardan oluşan marka karakterleri de tutundurma faaliyetlerinde büyük önem taşır .","audio_file":"ch3_p1.wav"},{"id":"ch3_p2","title":"Pazarlama İletişimi ve Toplum","text":"Pazarlama iletişimi, tüketici seçenekleri arasında ürünleri farklılaştırmak ve tek seslilik yaratmak açısından son derece önemlidir . Ancak işletmeler bu faaliyetlerini mutlaka sosyal sorumluluk sınırları dahilinde, ürünlerin doğru bilgilendirmesini yaparak ve çevreye zarar vermeyerek uygulamalıdır . Yüksek baskılı satış taktikleri, aldatıcı reklam ve ambalajlar, özelliklerini abartan mesajlar, mahremiyet ihlalleri veya savunmasız çocukları hedef alan iletişim çabaları tüketici ve toplum nezdinde yoğun şekilde eleştirilmektedir . Sağlıklı bir iletişim yapısı için rekabetin yanında, yasal düzenlemeler, kurumlar, işbirliği ve pazarlama faaliyetlerinde reklam ahlakı gibi etik kurallar ön planda tutulmalıdır .","audio_file":"ch3_p2.wav"}]}]};
const isBrowserTTS = false;
const SPEEDS=[0.75,1,1.25,1.5,2];
let sIdx=1, chIdx=0, cuIdx=0;
let audio=null, synth=window.speechSynthesis, useTTS=isBrowserTTS, utter=null;
let playing=false, progTimer=null;
let autoAdvance=true;

function allChunks(){
  const r=[];
  DATA.chapters.forEach((ch,ci)=>(ch.chunks||[]).forEach((cu,ui)=>r.push({ch,cu,ci,ui})));
  return r;
}
function flatIdx(ci,ui){
  let n=0;
  for(let i=0;i<DATA.chapters.length;i++){
    if(i===ci) return n+ui;
    n+=(DATA.chapters[i].chunks||[]).length;
  }
  return 0;
}

function init(){
  document.getElementById('courseTitle').textContent=DATA.course_title;
  document.getElementById('startCourseTitle').textContent=DATA.course_title;
  autoAdvance = JSON.parse(localStorage.getItem('sd_auto') !== null ? localStorage.getItem('sd_auto') : 'true');
  document.getElementById('autoBtn').classList.toggle('active', autoAdvance);
  buildTOC();
  const prog=JSON.parse(localStorage.getItem('sd_prog_'+DATA.course_title)||'{"ci":0,"ui":0}');
  chIdx=prog.ci||0; cuIdx=prog.ui||0;
  if(chIdx>=DATA.chapters.length) chIdx=0;
  const ch=DATA.chapters[chIdx];
  if(cuIdx>=(ch.chunks||[]).length) cuIdx=0;
  loadChunk(chIdx,cuIdx);
}

function startCourse() {
  const overlay = document.getElementById('startOverlay');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 300);
  
  if (window.speechSynthesis) {
    const unlock = new SpeechSynthesisUtterance('');
    unlock.volume = 0;
    window.speechSynthesis.speak(unlock);
  }
  
  play();
}

function buildTOC(){
  const toc=document.getElementById('toc');
  DATA.chapters.forEach((ch,ci)=>{
    const b=document.createElement('button');
    b.className='ch-btn'; b.id='ch_'+ci;
    b.textContent=ch.id+'. '+ch.title;
    b.onclick=()=>loadChunk(ci,0);
    toc.appendChild(b);
    (ch.chunks||[]).forEach((cu,ui)=>{
      const cb=document.createElement('button');
      cb.className='chunk-btn'; cb.id='cu_'+ci+'_'+ui;
      cb.textContent=(cu.title||('Parça '+(ui+1)));
      cb.onclick=()=>loadChunk(ci,ui);
      toc.appendChild(cb);
    });
  });
}

function loadChunk(ci,ui){
  stop();
  chIdx=ci; cuIdx=ui;
  const ch=DATA.chapters[ci];
  const cu=(ch.chunks||[])[ui];
  if(!cu) return;
  document.getElementById('npChap').textContent=ch.title;
  document.getElementById('npChunk').textContent=cu.title||'Parça '+(ui+1);
  document.getElementById('npText').textContent=cu.text;
  document.getElementById('pCurr').textContent='0:00';
  document.getElementById('pDur').textContent='—';
  document.getElementById('progFill').style.width='0%';
  document.getElementById('statusTxt').textContent='Oynatmaya başlamak için ▶ tuşuna basın';
  document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.chunk-btn').forEach(b=>b.classList.remove('active'));
  const cb=document.getElementById('ch_'+ci); if(cb) cb.classList.add('active');
  const kb=document.getElementById('cu_'+ci+'_'+ui); if(kb) kb.classList.add('active');
  saveProgress();

  if (!isBrowserTTS) {
    audio=new Audio('audio/'+cu.audio_file);
    audio.playbackRate=SPEEDS[sIdx];
    audio.ontimeupdate=updateProg;
    audio.onended=()=>handleEnd();
    
    audio.onerror=()=>{ 
      useTTS=true; 
      if(playing) {
        speakCurrent();
        document.getElementById('statusTxt').textContent='Oynatılıyor...';
        startProgTimer();
      } 
    };
    useTTS=false;
  } else {
    useTTS=true;
  }
}

function togglePlay(){ if(playing) stop(); else play(); }

function play(){
  playing=true;
  document.getElementById('playBtn').textContent='⏸';
  if(useTTS) { 
    speakCurrent(); 
    document.getElementById('statusTxt').textContent='Oynatılıyor...';
    startProgTimer();
  } else { 
    audio.play().then(() => {
      document.getElementById('statusTxt').textContent='Oynatılıyor...';
    }).catch((err)=>{ 
      if (err.name === 'NotAllowedError') {
        playing = false;
        document.getElementById('playBtn').textContent='▶';
        document.getElementById('statusTxt').textContent='Otomatik oynatma engellendi. Başlamak için ▶ tuşuna basın.';
      } else {
        useTTS=true; 
        speakCurrent(); 
        document.getElementById('statusTxt').textContent='Oynatılıyor...';
        startProgTimer();
      }
    }); 
  }
}

function stop(){
  playing=false;
  document.getElementById('playBtn').textContent='▶';
  audio?.pause();
  synth.cancel();
  clearInterval(progTimer);
}

function speakCurrent(){
  const ch=DATA.chapters[chIdx];
  const cu=(ch?.chunks||[])[cuIdx];
  if(!cu) return;
  
  let cuTitle = "";
  const tTitle = (cu.title || "").trim();
  const tText = (cu.text || "").trim();
  if (tTitle && !tText.toLowerCase().startsWith(tTitle.toLowerCase())) {
    cuTitle = tTitle + ". ";
  }
  
  let chTitle = "";
  if (cuIdx === 0 && ch.title) {
    chTitle = ch.title + ". ";
  }
  
  const fullText = chTitle + cuTitle + tText;
  
  utter=new SpeechSynthesisUtterance(fullText);
  utter.rate=SPEEDS[sIdx];
  utter.onend=()=>{ clearInterval(progTimer); handleEnd(); };
  synth.speak(utter);
  const wpm=Math.round(150*SPEEDS[sIdx]);
  const words=cu.text.split(/\s+/).length;
  const est=Math.ceil(words/wpm*60);
  document.getElementById('pDur').textContent=fmt(est);
}

let ttsStart=0, ttsDur=0;
function startProgTimer(){
  clearInterval(progTimer);
  const ch=DATA.chapters[chIdx];
  const cu=(ch?.chunks||[])[cuIdx];
  if(!cu) return;
  const wpm=Math.round(150*SPEEDS[sIdx]);
  ttsDur=Math.ceil(cu.text.split(/\s+/).length/wpm*60);
  ttsStart=Date.now();
  progTimer=setInterval(()=>{
    const el=(Date.now()-ttsStart)/1000;
    const pct=Math.min(el/ttsDur,1)*100;
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('pCurr').textContent=fmt(Math.floor(el));
    document.getElementById('pDur').textContent=fmt(ttsDur);
  },500);
}

function updateProg(){
  if(!audio) return;
  const pct=(audio.currentTime/audio.duration)*100||0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('pCurr').textContent=fmt(audio.currentTime);
  document.getElementById('pDur').textContent=fmt(audio.duration);
}

function seekAudio(e){
  if(!audio||useTTS) return;
  const bar=document.getElementById('progBar');
  const pct=e.offsetX/bar.offsetWidth;
  audio.currentTime=pct*audio.duration;
}

function skipTime(sec){
  if(!useTTS && audio){ audio.currentTime=Math.max(0,audio.currentTime+sec); return; }
  if(sec>0) nextChunk(true); else prevChunk();
}

function nextChunk(forcePlay = false){
  const p = playing || forcePlay || autoAdvance;
  const ch=DATA.chapters[chIdx];
  if(cuIdx+1 < (ch.chunks||[]).length){ loadChunk(chIdx,cuIdx+1); }
  else if(chIdx+1 < DATA.chapters.length){ loadChunk(chIdx+1,0); }
  if(p) play();
}
function prevChunk(){
  const p = playing;
  if(cuIdx>0){ loadChunk(chIdx,cuIdx-1); }
  else if(chIdx>0){ const pc=DATA.chapters[chIdx-1]; loadChunk(chIdx-1,(pc.chunks||[]).length-1); }
  if(p) play();
}

function handleEnd() {
  if(autoAdvance) {
    nextChunk(true);
  } else {
    stop();
    const ch=DATA.chapters[chIdx];
    if(cuIdx+1 < (ch.chunks||[]).length){ loadChunk(chIdx,cuIdx+1); }
    else if(chIdx+1 < DATA.chapters.length){ loadChunk(chIdx+1,0); }
  }
}

function toggleAuto() {
  autoAdvance = !autoAdvance;
  document.getElementById('autoBtn').classList.toggle('active', autoAdvance);
  localStorage.setItem('sd_auto', autoAdvance);
}

function cycleSpeed(){
  sIdx=(sIdx+1)%SPEEDS.length;
  const s=SPEEDS[sIdx];
  document.getElementById('speedBtn').textContent=s+'×';
  if(audio) audio.playbackRate=s;
  if(utter) utter.rate=s;
}

function saveProgress(){ localStorage.setItem('sd_prog_'+DATA.course_title,JSON.stringify({ci:chIdx,ui:cuIdx})); }
function fmt(s){ if(!s||isNaN(s)) return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+(s%60+'').padStart(2,'0'); }
init();
</script>
</body></html>
