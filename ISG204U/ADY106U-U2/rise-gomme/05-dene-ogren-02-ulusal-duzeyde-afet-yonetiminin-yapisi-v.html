<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Türkiye’nin Afet Yönetim Sistemi</title>
<style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap');

/* ============================================================
   Çöz-Öğren çalışma zamanı — kurumsal tasarım sistemi
   Lacivert kurum rengi, ölçülü mavi vurgu, başarı öğelerinde altın.
   ============================================================ */
:root {
  --ink: #13243d;
  --ink-2: #3c4d68;
  --ink-3: #6f7f99;
  --paper: #f2f4f8;
  --card: #ffffff;

  --accent: #1d5c9e;
  --accent-2: #164a80;
  --accent-tint: #e9f0f8;

  --gold: #8f6b1c;
  --gold-2: #b8912f;
  --gold-tint: #f8f1de;

  --rule: #d5dce7;
  --rule-soft: #e6eaf1;
  --ok: #1a6b47;
  --ok-tint: #e7f2ec;
  --no: #a83232;
  --no-tint: #f8eaea;

  --display: 'Source Serif 4', Georgia, serif;
  --body: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;

  --r-s: 4px;
  --r-m: 8px;
  --r-l: 12px;
  --shadow: 0 1px 2px rgba(19, 36, 61, .05), 0 6px 18px -10px rgba(19, 36, 61, .16);
  --shadow-lift: 0 2px 4px rgba(19, 36, 61, .07), 0 16px 34px -16px rgba(19, 36, 61, .26);
  --maxw: 880px;
  --side-w: 306px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body.eo-body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.eo-shell { display: flex; min-height: 100vh; align-items: flex-start; }

/* ============================================================
   Kenar çubuğu
   ============================================================ */
.eo-side {
  width: var(--side-w);
  flex: 0 0 var(--side-w);
  background: var(--ink);
  color: #fff;
  padding: 22px 20px 26px;
  position: sticky;
  top: 0;
  max-height: 100vh;
  overflow-y: auto;
}

.eo-brand { display: block; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, .13); }
.eo-brand .eo-eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em;
  text-transform: uppercase; color: #92a5c2; margin-bottom: 10px;
}
.eo-brand h1 {
  font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.2;
  margin: 0 0 6px; letter-spacing: -.005em;
}
.eo-brand p { margin: 0; font-size: 13px; color: #a9b8d3; line-height: 1.5; }

.eo-side-foot {
  margin-top: 18px; padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, .13);
  font-size: 11.5px; color: #8fa0bd; line-height: 1.55;
}

/* ---- Rütbe ve puan ---- */
.eo-rank { margin: 16px 0 14px; }
.eo-rank-top { display: flex; align-items: center; gap: 11px; margin-bottom: 9px; }
.eo-rank-seal {
  width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid var(--gold-2); background: rgba(184, 145, 47, .14);
  font-family: var(--mono); font-size: 15px; font-weight: 500; color: #e3c579;
}
.eo-rank-name { font-family: var(--display); font-weight: 600; font-size: 16.5px; line-height: 1.2; }
.eo-rank-pts { font-family: var(--mono); font-size: 11.5px; color: #92a5c2; margin-top: 3px; }
.eo-rank-track { height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.eo-rank-track i {
  display: block; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--gold), var(--gold-2));
  transition: width .5s cubic-bezier(.3, .1, .2, 1);
}
.eo-rank-next { font-family: var(--mono); font-size: 10.5px; color: #8fa0bd; margin-top: 6px; }

/* ---- İlerleme ---- */
.eo-progress { margin: 0 0 16px; }
.eo-prog-top {
  display: flex; align-items: baseline; justify-content: space-between;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: #92a5c2; margin-bottom: 8px;
}
.eo-prog-top b { font-size: 17px; color: #fff; letter-spacing: 0; font-weight: 600; }
.eo-prog-track { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.eo-prog-track i {
  display: block; height: 100%; width: 0; border-radius: 999px;
  background: #6ea8e0; transition: width .5s cubic-bezier(.3, .1, .2, 1);
}
.eo-progress.is-full .eo-prog-track i { background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
.eo-prog-meta {
  display: flex; align-items: center; gap: 10px; justify-content: space-between;
  margin-top: 8px; font-size: 11.5px; color: #92a5c2;
}
.eo-prog-reset {
  background: none; border: 0; padding: 0; font: inherit; font-size: 11.5px;
  color: #92a5c2; text-decoration: underline; cursor: pointer;
}
.eo-prog-reset:hover { color: #fff; }

/* ---- Rozetler ---- */
.eo-badges { margin-bottom: 6px; }
.eo-badges h4 {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: #92a5c2; margin: 0 0 8px; font-weight: 400;
}
.eo-badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.eo-badge {
  aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .05);
  color: rgba(255, 255, 255, .32); position: relative; padding: 0;
  transition: transform .2s ease, border-color .2s ease, background .2s ease;
}
.eo-badge svg { width: 18px; height: 18px; display: block; }
.eo-badge.is-earned { border-color: var(--gold-2); background: rgba(184, 145, 47, .16); color: #e3c579; }
.eo-badge.is-earned:hover { transform: translateY(-2px); }
.eo-badge.is-new { animation: eo-badge-pop .6s ease; }
@keyframes eo-badge-pop {
  0% { transform: scale(.5); }
  60% { transform: scale(1.16); }
  100% { transform: scale(1); }
}

/* Rozet bildirimi */
.eo-award {
  position: fixed; right: 22px; bottom: 22px; z-index: 60; max-width: 330px;
  display: flex; align-items: center; gap: 14px;
  background: var(--ink); color: #fff; border-radius: var(--r-l);
  border-left: 3px solid var(--gold-2);
  padding: 15px 20px 15px 17px; box-shadow: var(--shadow-lift);
  transform: translateY(16px); opacity: 0; transition: .32s cubic-bezier(.2, .7, .3, 1);
}
.eo-award.show { transform: translateY(0); opacity: 1; }
.eo-award-seal {
  width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid var(--gold-2); background: rgba(184, 145, 47, .18); color: #e3c579;
}
.eo-award-seal svg { width: 19px; height: 19px; }
.eo-award-kicker {
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: #e3c579; margin-bottom: 3px;
}
.eo-award-name { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.25; }
.eo-award-desc { font-size: 12.5px; color: #b3c1d9; margin-top: 2px; line-height: 1.4; }

/* ---- Gezinme ---- */
.eo-nav { list-style: none; margin: 14px 0 16px; padding: 0; display: grid; gap: 1px; }
.eo-nav button {
  width: 100%; display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 13px;
  background: transparent; border: 0; border-left: 2px solid transparent;
  border-radius: 0 var(--r-m) var(--r-m) 0;
  padding: 9px 11px; color: #ccd6e8; font: inherit; font-size: 14.5px; text-align: left;
  cursor: pointer; transition: background .16s ease, color .16s ease, border-color .16s ease;
}
.eo-nav button:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.eo-nav button[aria-current="true"] {
  background: rgba(255, 255, 255, .1); color: #fff; font-weight: 600; border-left-color: #6ea8e0;
}
.eo-nav .eo-num {
  font-family: var(--mono); font-size: 11.5px; width: 28px; height: 28px;
  display: grid; place-items: center; border: 1.5px solid currentColor;
  border-radius: 50%; opacity: .55;
}
.eo-nav button[aria-current="true"] .eo-num { opacity: 1; border-color: #6ea8e0; color: #6ea8e0; }
.eo-nav button.is-done .eo-num { border-color: var(--gold-2); color: #e3c579; opacity: 1; }
.eo-nav button.is-done[aria-current="true"] .eo-num { background: rgba(184, 145, 47, .2); }
.eo-navmeta { display: block; font-size: 11px; opacity: .62; font-family: var(--mono); margin-top: 2px; }

.eo-menubtn { display: none; }

/* ============================================================
   İçerik alanı
   ============================================================ */
.eo-main { flex: 1; min-width: 0; padding: 32px 34px 64px; }
.eo-wrap { max-width: var(--maxw); margin: 0 auto; }

.eo-lessonhead { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.eo-lessonhead .eo-kicker {
  font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
}
.eo-lessonhead h2 {
  font-family: var(--display); font-weight: 700; font-size: clamp(27px, 4vw, 38px);
  line-height: 1.15; letter-spacing: -.015em; margin: 0 0 7px;
}
.eo-lessonhead p { margin: 0; color: var(--ink-2); max-width: 64ch; font-size: 16px; }

.eo-activity {
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-l);
  box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
}
.eo-act-head {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 18px; border-bottom: 1px solid var(--rule-soft); background: #fbfcfe;
}
.eo-act-head .eo-tag {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); border: 1px solid var(--rule); border-radius: var(--r-s);
  padding: 4px 9px; white-space: nowrap;
}
.eo-act-head h3 {
  font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0;
  flex: 1; min-width: 0; line-height: 1.3;
}
.eo-act-body { padding: 20px 18px; }

.eo-act-tick {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: var(--gold-tint); color: var(--gold); border: 1px solid rgba(143, 107, 28, .3);
  opacity: 0; transform: scale(.6); transition: opacity .3s ease, transform .3s ease;
}
.eo-activity.is-complete .eo-act-tick { opacity: 1; transform: scale(1); }
.eo-activity.is-complete { border-color: rgba(143, 107, 28, .32); }
.eo-activity.is-complete .eo-act-head { background: var(--gold-tint); }

.eo-earned {
  font-family: var(--mono); font-size: 11px; color: var(--gold);
  background: var(--gold-tint); border-radius: var(--r-s); padding: 4px 9px; white-space: nowrap;
}

/* ============================================================
   Ortak bileşenler
   ============================================================ */
.eo-bubble {
  width: 28px; height: 28px; flex: 0 0 28px;
  border: 1.5px solid var(--rule); border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); background: #fff;
  transition: background .18s ease, border-color .18s ease, color .18s ease;
}
.eo-rail { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.eo-rail .eo-dot {
  width: 11px; height: 11px; border-radius: 50%;
  border: 1.5px solid var(--rule); background: #fff; transition: all .18s ease;
}
.eo-rail .eo-dot.is-current { border-color: var(--ink); transform: scale(1.25); }
.eo-rail .eo-dot.is-ok { background: var(--ok); border-color: var(--ok); }
.eo-rail .eo-dot.is-no { background: var(--no); border-color: var(--no); }

.eo-btn {
  font: inherit; font-weight: 600; font-size: 14.5px;
  border-radius: var(--r-m); padding: 11px 20px;
  border: 1px solid var(--ink); background: var(--ink); color: #fff;
  cursor: pointer; transition: background .16s ease, opacity .16s ease;
}
.eo-btn:hover { background: #1d3255; }
.eo-btn[disabled] { opacity: .4; cursor: not-allowed; }
.eo-btn.ghost { background: #fff; color: var(--ink); border-color: var(--rule); }
.eo-btn.ghost:hover { border-color: var(--ink-3); background: #f7f9fc; }
.eo-btn.accent { background: var(--accent); border-color: var(--accent); }
.eo-btn.accent:hover { background: var(--accent-2); }
.eo-btn.sm { padding: 8px 15px; font-size: 13.5px; }

.eo-actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.eo-spacer { flex: 1; }
.eo-counter { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
.eo-counter b { color: var(--ink); font-size: 16px; font-weight: 500; }

:where(button, a, input, [tabindex]):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-s);
}

/* ============================================================
   1) Tıkla-Öğren
   ============================================================ */
.eo-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; }
.eo-card { perspective: 1400px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
.eo-card-inner {
  position: relative; width: 100%; min-height: 186px;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4, .1, .2, 1);
}
.eo-card[aria-pressed="true"] .eo-card-inner { transform: rotateY(180deg); }
.eo-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--r-m); padding: 22px 18px;
  display: flex; flex-direction: column; justify-content: center; text-align: center;
  border: 1px solid var(--rule);
}
.eo-face-front { background: var(--ink); color: #fff; border-color: var(--ink); }
.eo-face-front .eo-term { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.3; }
.eo-face-front .eo-hint {
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: #92a5c2; margin-top: 14px;
}
.eo-face-back {
  transform: rotateY(180deg); background: #fff; border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-tint);
  font-size: 14.5px; line-height: 1.55; color: var(--ink-2);
  overflow-y: auto; overscroll-behavior: contain;
  /* Taşan metin ortalanırken üstten kırpılmasın diye içerik akışa bırakılır */
  justify-content: flex-start; padding: 20px 15px;
  scrollbar-width: thin;
}
.eo-face-back p { margin: auto 0; }   /* kısa metinler yine dikeyde ortalanır */
.eo-card-idx { position: absolute; top: 11px; left: 13px; font-family: var(--mono); font-size: 10.5px; opacity: .5; }

/* ============================================================
   2) Yanıtla-Öğren
   ============================================================ */
.eo-quiz-top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);
}
.eo-streak {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  color: var(--gold); background: var(--gold-tint); border: 1px solid rgba(143, 107, 28, .25);
  border-radius: var(--r-s); padding: 4px 10px; animation: eo-streak-in .3s ease;
}
@keyframes eo-streak-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }

.eo-qtext { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.45; margin: 0 0 15px; }
.eo-options { display: grid; gap: 7px; }
.eo-opt {
  display: flex; align-items: flex-start; gap: 13px; width: 100%; text-align: left;
  padding: 13px 16px; border: 1px solid var(--rule); border-radius: var(--r-m);
  background: #fff; font: inherit; font-size: 15.5px; color: var(--ink); cursor: pointer;
  transition: border-color .16s ease, background .16s ease;
}
.eo-opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-tint); }
.eo-opt:not(.is-picked):hover:not([disabled]) .eo-bubble { border-color: var(--accent); color: var(--accent); }
.eo-opt.is-picked { border-color: var(--accent); background: var(--accent-tint); }
.eo-opt.is-picked .eo-bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
.eo-opt.is-ok { border-color: var(--ok); background: var(--ok-tint); }
.eo-opt.is-ok .eo-bubble { background: var(--ok); border-color: var(--ok); color: #fff; }
.eo-opt.is-no { border-color: var(--no); background: var(--no-tint); }
.eo-opt.is-no .eo-bubble { background: var(--no); border-color: var(--no); color: #fff; }
.eo-opt[disabled] { cursor: default; }

.eo-feedback {
  margin-top: 14px; padding: 13px 16px; border-radius: var(--r-m);
  border: 1px solid var(--rule); border-left: 3px solid var(--accent);
  background: #fbfcfe; font-size: 14.5px; line-height: 1.6; color: var(--ink-2);
}
.eo-feedback .eo-fb-title {
  font-family: var(--display); font-weight: 600; font-size: 15.5px; color: var(--accent); margin-bottom: 4px;
}
.eo-feedback.is-ok { border-left-color: var(--ok); background: var(--ok-tint); border-color: rgba(26, 107, 71, .25); }
.eo-feedback.is-ok .eo-fb-title { color: var(--ok); }
.eo-feedback.is-no { border-left-color: var(--no); background: var(--no-tint); border-color: rgba(168, 50, 50, .22); }
.eo-feedback.is-no .eo-fb-title { color: var(--no); }

.eo-result { text-align: center; padding: 12px 4px 4px; }
.eo-score-ring {
  width: 118px; height: 118px; margin: 0 auto 16px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--accent) var(--pct, 0%), var(--rule-soft) 0);
}
.eo-score-ring.is-high { background: conic-gradient(var(--gold-2) var(--pct, 0%), var(--rule-soft) 0); }
.eo-score-ring::after { content: ""; position: absolute; inset: 10px; background: #fff; border-radius: 50%; }
.eo-score-ring span {
  position: relative; z-index: 1; font-family: var(--display); font-weight: 700; font-size: 31px;
}
.eo-result h4 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 0 8px; }
.eo-result p { margin: 0 auto 20px; color: var(--ink-2); max-width: 48ch; }
.eo-review { text-align: left; margin-top: 18px; display: grid; gap: 6px; }
.eo-review-item {
  display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 13px 16px;
  border: 1px solid var(--rule-soft); border-radius: var(--r-m); font-size: 14.5px;
}
.eo-review-item .eo-mark {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; color: #fff; font-weight: 700;
}
.eo-review-item.ok .eo-mark { background: var(--ok); }
.eo-review-item.no .eo-mark { background: var(--no); }
.eo-review-item small { display: block; color: var(--ink-3); margin-top: 4px; }

/* ============================================================
   3) Bul-Öğren
   ============================================================ */
.eo-puzzle { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
.eo-puzzle-left { min-width: 0; }
.eo-grid-scroll { overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
.eo-grid { display: grid; gap: 3px; width: max-content; grid-auto-rows: var(--cell, 34px); }
.eo-cell {
  position: relative; width: var(--cell, 34px); height: var(--cell, 34px); background: transparent;
}
.eo-cell.open { background: #fff; border: 1px solid var(--ink); border-radius: var(--r-s); }
.eo-cell input {
  width: 100%; height: 100%; border: 0; background: transparent; text-align: center;
  font-family: var(--mono); font-size: 16px; font-weight: 500; text-transform: uppercase;
  color: var(--ink); padding: 0; border-radius: 0;   /* 16px: iOS'ta odaklanınca yakınlaşmayı önler */
}
.eo-cell input:focus { outline: 0; }
.eo-cell.is-word { background: var(--accent-tint); }

/* Aktif hücre yönü: yatayda mavi ve sağ ok, dikeyde amber ve alt ok */
.eo-grid.dir-across .eo-cell.is-active { background: #cfe2f4; border-color: var(--accent); }
.eo-grid.dir-across .eo-cell.is-active::after {
  content: '➤'; position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
  font-size: 10px; color: var(--accent); pointer-events: none; z-index: 3;
}

   Kelime + ipucu listesinden ızgarayı kendisi kurar, kesişimleri

(function (global) {
  'use strict';

  var TR_UP = { 'i': 'İ', 'ı': 'I', 'ş': 'Ş', 'ğ': 'Ğ', 'ü': 'Ü', 'ö': 'Ö', 'ç': 'Ç' };

  function upperTR(s) {
    return String(s || '').replace(/[iışğüöç]/g, function (c) { return TR_UP[c]; }).toUpperCase();
  }

  /** Yerleştirmeden önce cevabı sadeleştirir: harf dışındaki her şey atılır. */
  function normalize(s) {

   * Kelimeleri kesişimli biçimde yerleştirir.

  function layout(words) {

      var minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
      grid.forEach(function (v, k) {
        var p = k.split(','), r = +p[0], c = +p[1];
        if (r < minR) minR = r; if (r > maxR) maxR = r;
        if (c < minC) minC = c; if (c > maxC) maxC = c;
      });
      if (minR === Infinity) return { minR: 0, maxR: 0, minC: 0, maxC: 0 };
      return { minR: minR, maxR: maxR, minC: minC, maxC: maxC };
    }

    // Sol üst köşe 0,0 olacak şekilde kaydır
    var b = getBounds();
    var shifted = new Map();
    grid.forEach(function (v, k) {
      var p = k.split(',');
      shifted.set(key(+p[0] - b.minR, +p[1] - b.minC), v);
    });
    placed.forEach(function (p) { p.row -= b.minR; p.col -= b.minC; });

    // Numaralandırma: yukarıdan aşağı, soldan sağa
    placed.sort(function (a, x) { return a.row - x.row || a.col - x.col; });
    var nums = {};
    var n = 0;
    placed.forEach(function (p) {
      var kk = key(p.row, p.col);
      if (!nums[kk]) nums[kk] = ++n;
      p.num = nums[kk];
    });

    return {
      placed: placed,
      skipped: skipped,
      grid: shifted,
      rows: b.maxR - b.minR + 1,
      cols: b.maxC - b.minC + 1
    };
  }

  /**
   * Bulmacayı verilen kapsayıcıya çizer ve etkileşimi bağlar.

  function render(host, words, opts) {

    var model = layout(words || []);
    host.innerHTML = '';

    if (!model.placed.length) {
      host.innerHTML = '<div class="eo-empty">Bu bulmacada henüz kelime yok.</div>';
      return null;
    }

    var wrap = document.createElement('div');
    wrap.className = 'eo-puzzle';

    var left = document.createElement('div');
    left.className = 'eo-puzzle-left';

    // Yön kutusu: aktif yön, o an çözülen ipucu ve kelimeler arası gezinme
    var bar = document.createElement('div');
    bar.className = 'eo-cwbar';
    bar.innerHTML =
      '<div class="eo-cwtop">' +
        '<span class="eo-cwdir" data-dir>Yatay <b>➤</b></span>' +
        '<span class="eo-cwnav">' +
          '<button type="button" class="eo-cwstep" data-prev aria-label="Önceki kelime">‹</button>' +
          '<button type="button" class="eo-cwstep" data-next aria-label="Sonraki kelime">›</button>' +
        '</span>' +
      '</div>' +
      '<div class="eo-cwclue" data-clue></div>' +
      '<div class="eo-cwhelp">Yönü değiştirmek için hücreye yeniden dokunun ya da boşluk tuşuna basın.</div>';
    left.appendChild(bar);

    var scroll = document.createElement('div');
    scroll.className = 'eo-grid-scroll';
    var gridEl = document.createElement('div');
    gridEl.className = 'eo-grid dir-across';
    gridEl.style.gridTemplateColumns = 'repeat(' + model.cols + ', var(--cell, 34px))';
    scroll.appendChild(gridEl);
    left.appendChild(scroll);

    var cells = {};
    var startNums = {};
    model.placed.forEach(function (p) { startNums[key(p.row, p.col)] = p.num; });

    for (var r = 0; r < model.rows; r++) {
      for (var c = 0; c < model.cols; c++) {
        var cell = document.createElement('div');
        cell.className = 'eo-cell';
        var letter = model.grid.get(key(r, c));
        if (letter) {
          cell.className += ' open';
          var num = startNums[key(r, c)];
          if (num) cell.innerHTML = '<span class="eo-cnum">' + num + '</span>';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.setAttribute('maxlength', '2');
          inp.setAttribute('autocomplete', 'off');
          inp.setAttribute('autocorrect', 'off');

    var down = model.placed.filter(function (p) { return p.dir === 'down'; });
    var clueBtns = {};

    function clueList(title, arr) {
      if (!arr.length) return null;
      var box = document.createElement('div');
      var h = document.createElement('h4');
      h.textContent = title;
      var ol = document.createElement('ol');
      arr.forEach(function (p) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = '<span class="eo-cn">' + p.num + '</span><span>' + escapeHtml(p.clue) +

        if (d === 'across') return p.row === r && c >= p.col && c < p.col + p.text.length;

      if (!active) return null;
      return wordAt(active.r, active.c, dir) ||
             wordAt(active.r, active.c, dir === 'across' ? 'down' : 'across');
    }

      Object.keys(cells).forEach(function (k) {
        cells[k].el.classList.remove('is-active', 'is-word');
      });
      Object.keys(clueBtns).forEach(function (k) { clueBtns[k].btn.removeAttribute('aria-current'); });

      gridEl.classList.toggle('dir-across', dir === 'across');
      gridEl.classList.toggle('dir-down', dir === 'down');
      bar.classList.toggle('is-down', dir === 'down');
      bar.querySelector('[data-dir]').innerHTML = dir === 'across'
        ? 'Yatay · soldan sağa <b>➤</b>'
        : 'Dikey · yukarıdan aşağı <b>▼</b>';

      if (!active) { bar.querySelector('[data-clue]').textContent = ''; return; }

      var w = currentWord();
      if (w) {
        for (var i = 0; i < w.text.length; i++) {
          var rr = w.dir === 'down' ? w.row + i : w.row;
          var cc = w.dir === 'across' ? w.col + i : w.col;
          if (cells[key(rr, cc)]) cells[key(rr, cc)].el.classList.add('is-word');
        }
        var cb = clueBtns[w.num + w.dir];
        if (cb) cb.btn.setAttribute('aria-current', 'true');
        bar.querySelector('[data-clue]').innerHTML =
          '<span class="eo-cwnum">' + w.num + '</span>' + escapeHtml(w.clue) +
          ' <span class="eo-cwlen">(' + w.text.length + ' harf)</span>';
      } else {
        bar.querySelector('[data-clue]').textContent = '';
      }

      var cur = cells[key(active.r, active.c)];
      if (cur) cur.el.classList.add('is-active');
    }

    function fitGrid() {
      var avail = (scroll.clientWidth || left.clientWidth || 320) - 2;
      var gap = 3;
      var size = Math.floor((avail - (model.cols - 1) * gap) / model.cols);
      size = Math.max(22, Math.min(34, size));
      gridEl.style.setProperty('--cell', size + 'px');
      gridEl.style.setProperty('--cnum', (size < 27 ? 7.5 : 8.5) + 'px');

      var cell = cells[key(r, c)];

      if (!silent) cell.input.focus({ preventScroll: false });

      dir = p.dir;
      focusCell(p.row, p.col);

      var dr = dir === 'down' ? 1 : 0, dc = dir === 'across' ? 1 : 0;

      var inp = e.target.closest('input');
      if (!inp) return;
      var r = +inp.dataset.r, c = +inp.dataset.c;

        // Aynı hücreye yeniden dokunuş: yalnızca o yönde kelime varsa yön değişir

        return a.num - b.num || (a.dir === 'across' ? -1 : 1);

        var other = dir === 'across' ? 'down' : 'across';

      inp.value = ch;

    });

    gridEl.addEventListener('keydown', function (e) {
      var inp = e.target;
      if (inp.tagName !== 'INPUT') return;
      var r = +inp.dataset.r, c = +inp.dataset.c;
      if (e.key === ' ') {
        e.preventDefault();
        var other = dir === 'across' ? 'down' : 'across';
        if (wordAt(r, c, other)) { dir = other; paint(); }
        return;

        if (!inp.value) { e.preventDefault(); step(r, c, true); }
        else { inp.parentElement.classList.remove('is-ok', 'is-no'); }
        return;
      }

      if (moves[e.key]) {
        e.preventDefault();
        var want = (e.key === 'ArrowUp' || e.key === 'ArrowDown') ? 'down' : 'across';
        if (dir !== want) { dir = want; paint(); }
        var nr = r + moves[e.key][0], nc = c + moves[e.key][1];
        var guard = 0;
        while (!cells[key(nr, nc)] && guard++ < 30 && nr >= -1 && nc >= -1 && nr <= model.rows && nc <= model.cols) {
          nr += moves[e.key][0]; nc += moves[e.key][1];
        }
        if (cells[key(nr, nc)]) focusCell(nr, nc);
      }
    });

    function progress() {
      var filled = 0, total = 0, correct = 0;
      Object.keys(cells).forEach(function (k) {
        total++;
        var v = cells[k].input.value;
        if (v) filled++;
        if (v === cells[k].answer) correct++;
      });
      return { filled: filled, total: total, correct: correct, solved: correct === total };
    }

    var api = {
      check: function () {
        var solvedWords = 0;
        model.placed.forEach(function (p) {
          var ok = true;
          for (var i = 0; i < p.text.length; i++) {
            var rr = p.dir === 'down' ? p.row + i : p.row;
            var cc = p.dir === 'across' ? p.col + i : p.col;
            var cell = cells[key(rr, cc)];
            if (!cell) continue;
            if (cell.input.value !== cell.answer) ok = false;
          }
          var cb = clueBtns[p.num + p.dir];
          if (cb) cb.li.classList.toggle('solved', ok);
          if (ok) solvedWords++;
        });
        Object.keys(cells).forEach(function (k) {
          var cell = cells[k];
          cell.el.classList.remove('is-ok', 'is-no');
          if (!cell.input.value) return;
          cell.el.classList.add(cell.input.value === cell.answer ? 'is-ok' : 'is-no');
        });
        return { words: model.placed.length, solvedWords: solvedWords, cells: progress() };
      },
      reveal: function () {
        Object.keys(cells).forEach(function (k) {
          cells[k].input.value = cells[k].answer;
          cells[k].el.classList.remove('is-no');
          cells[k].el.classList.add('is-ok');
        });
        Object.keys(clueBtns).forEach(function (k) { clueBtns[k].li.classList.add('solved'); });
        return progress();
      },
      clear: function () {
        Object.keys(cells).forEach(function (k) {
          cells[k].input.value = '';
          cells[k].el.classList.remove('is-ok', 'is-no');
        });
        Object.keys(clueBtns).forEach(function (k) { clueBtns[k].li.classList.remove('solved'); });
        return progress();
      },
      progress: progress,
      model: model
    };

    fitGrid();
    focusWord(model.placed[0]);
    var fitTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitGrid, 120);
    });
    api.fit = fitGrid;
    return api;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

      btn.innerHTML =
        '<div class="eo-card-inner">' +
          '<div class="eo-face eo-face-front">' +
            '<span class="eo-card-idx">' + String(i + 1).padStart(2, '0') + '</span>' +
            '<span class="eo-term">' + rich(it.term) + '</span>' +
            '<span class="eo-hint">açıklama için tıklayın</span>' +
          '</div>' +
          '<div class="eo-face eo-face-back"><p>' + rich(it.definition) + '</p></div>' +
        '</div>';
      btn.addEventListener('click', function () {
        var now = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', now ? 'false' : 'true');
        if (!now && !btn.dataset.seen) { btn.dataset.seen = '1'; flipped++; count(); }
      });
      buttons.push(btn);
      grid.appendChild(btn);
    });

    var bar = el('div', 'eo-actions');
    var meta = el('span', 'eo-counter');
    var flipAll = el('button', 'eo-btn ghost sm', 'Tümünü çevir');
    var reset = el('button', 'eo-btn ghost sm', 'Baştan');
    flipAll.type = reset.type = 'button';

    flipAll.addEventListener('click', function () {
      buttons.forEach(function (b) {
        b.setAttribute('aria-pressed', 'true');
        if (!b.dataset.seen) { b.dataset.seen = '1'; flipped++; }
      });
      count();
    });
    reset.addEventListener('click', function () {
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); delete b.dataset.seen; });
      flipped = 0; count();
    });

    function count() {
      meta.innerHTML = '<b>' + flipped + '</b> / ' + items.length + ' kart görüldü';
      if (flipped >= items.length) done(1);
    }
    count();

    bar.appendChild(meta);
    bar.appendChild(el('span', 'eo-spacer'));
    bar.appendChild(reset);
    bar.appendChild(flipAll);

    host.appendChild(grid);
    host.appendChild(bar);
  }

  // ---------- 2) Yanıtla-Öğren ----------
  function renderQuiz(act, host, done, opts_ctx) {
    opts_ctx = opts_ctx || {};
    var items = (act.items || []).filter(function (q) { return q && q.question; });
    if (!items.length) { host.appendChild(el('div', 'eo-empty', 'Bu testte henüz soru yok.')); return; }

    var idx = 0;
    var answers = new Array(items.length).fill(null);
    var picked = null;                       // onaylanmamış seçim
    var streak = 0, bestStreak = 0;
    var stage = el('div');
    host.appendChild(stage);

    function rail() {
      var r = el('div', 'eo-rail');
      items.forEach(function (_, i) {
        var d = el('span', 'eo-dot');
        if (answers[i] != null) d.classList.add(answers[i] === items[i].answer ? 'is-ok' : 'is-no');
        if (i === idx) d.classList.add('is-current');
        r.appendChild(d);
      });
      return r;
    }

    function drawQuestion() {
      stage.innerHTML = '';
      var q = items[idx];

      var top = el('div', 'eo-quiz-top');
      top.appendChild(el('span', 'eo-counter', '<b>' + (idx + 1) + '</b> / ' + items.length + ' soru'));
      if (streak >= 2) top.appendChild(el('span', 'eo-streak', 'üst üste ' + streak + ' doğru'));
      top.appendChild(el('span', 'eo-spacer'));
      top.appendChild(rail());
      stage.appendChild(top);

      stage.appendChild(el('p', 'eo-qtext', rich(q.question)));

      var opts = el('div', 'eo-options');
      var locked = answers[idx] != null;
      (q.options || []).forEach(function (text, i) {
        var b = el('button', 'eo-opt');
        b.type = 'button';
        b.innerHTML = '<span class="eo-bubble">' + (LETTERS[i] || i + 1) + '</span><span>' + rich(text) + '</span>';
        if (locked) {
          b.disabled = true;
          if (i === q.answer) b.classList.add('is-ok');
          else if (i === answers[idx]) b.classList.add('is-no');
        } else if (picked === i) {
          b.classList.add('is-picked');
          b.setAttribute('aria-pressed', 'true');
        }
        b.addEventListener('click', function () {
          if (answers[idx] != null) return;
          picked = (picked === i) ? null : i;   // aynı şıkka yeniden tıklayınca seçim kalkar
          drawQuestion();
        });
        opts.appendChild(b);
      });
      stage.appendChild(opts);

      if (locked) {
        var right = answers[idx] === q.answer;
        var fb = el('div', 'eo-feedback ' + (right ? 'is-ok' : 'is-no'));
        fb.appendChild(el('div', 'eo-fb-title', right
          ? 'Tebrikler, yanıtınız doğru!'
          : 'Yanıtınız yanlış! Doğru yanıt: ' + (LETTERS[q.answer] || '')));
        var body = q.explanation || (right
          ? 'Doğru seçeneği işaretlediniz.'
          : 'Doğru seçenek yukarıda yeşille gösterilmiştir.');
        fb.appendChild(el('div', '', rich(body)));
        stage.appendChild(fb);
      }

      var bar = el('div', 'eo-actions');
      var prev = el('button', 'eo-btn ghost sm', '← Önceki');
      prev.type = 'button';
      prev.disabled = idx === 0;
      prev.addEventListener('click', function () { idx--; picked = null; drawQuestion(); });
      bar.appendChild(prev);
      bar.appendChild(el('span', 'eo-spacer'));

      if (!locked) {
        var confirm = el('button', 'eo-btn accent', 'Yanıtı onayla');
        confirm.type = 'button';
        confirm.disabled = picked == null;
        confirm.addEventListener('click', function () {
          if (picked == null) return;
          answers[idx] = picked;
          if (picked === q.answer) {
            streak++;
            if (streak > bestStreak) bestStreak = streak;
            if (streak >= 5 && opts_ctx.award) opts_ctx.award('seri');
          } else { streak = 0; }
          picked = null;
          drawQuestion();
        });
        bar.appendChild(confirm);
      } else {
        var next = el('button', 'eo-btn', idx === items.length - 1 ? 'Sonucu gör' : 'Sonraki →');
        next.type = 'button';
        next.addEventListener('click', function () {
          if (idx === items.length - 1) drawResult();
          else { idx++; picked = null; drawQuestion(); }
        });
        bar.appendChild(next);
      }
      stage.appendChild(bar);
    }

    function drawResult() {
      stage.innerHTML = '';
      var correct = answers.filter(function (a, i) { return a === items[i].answer; }).length;
      var pct = Math.round(correct / items.length * 100);
      done(correct / items.length);
      if (pct === 100 && opts_ctx.award) opts_ctx.award('kusursuz');

      var box = el('div', 'eo-result');
      var ring = el('div', 'eo-score-ring' + (pct >= 80 ? ' is-high' : ''), '<span>%' + pct + '</span>');
      ring.style.setProperty('--pct', pct + '%');
      box.appendChild(ring);
      box.appendChild(el('h4', '', items.length + ' sorudan ' + correct + ' doğru'));
      box.appendChild(el('p', '', pct >= 80 ? 'Konuya hâkimsiniz. Yanlış yanıtladığınız soruların açıklamalarını gözden geçirip diğer etkinliklere geçebilirsiniz.'
        : pct >= 50 ? 'İyi bir başlangıç. Aşağıdaki listeden yanlış yanıtlarınızı inceleyip testi yeniden çözün.'
        : 'Konuyu Dene-Öğren modülünden tekrar edip testi yeniden çözmenizi öneririz.'));

      var review = el('div', 'eo-review');
      items.forEach(function (q, i) {
        var ok = answers[i] === q.answer;
        var row = el('div', 'eo-review-item ' + (ok ? 'ok' : 'no'));
        row.appendChild(el('span', 'eo-mark', ok ? '✓' : '✕'));
        var body = el('div');
        body.appendChild(el('div', '', rich(q.question)));
        body.appendChild(el('small', '', 'Doğru yanıt: ' + (LETTERS[q.answer] || '') + ') ' + esc((q.options || [])[q.answer] || '')));
        row.appendChild(body);
        review.appendChild(row);
      });
      box.appendChild(review);

      var bar = el('div', 'eo-actions');
      bar.appendChild(el('span', 'eo-spacer'));
      var again = el('button', 'eo-btn accent', 'Testi yeniden çöz');
      again.type = 'button';
      again.addEventListener('click', function () {
        answers = new Array(items.length).fill(null);
        idx = 0; streak = 0; drawQuestion();
      });
      bar.appendChild(again);
      bar.appendChild(el('span', 'eo-spacer'));
      box.appendChild(bar);

      stage.appendChild(box);
    }

    drawQuestion();
  }

  // ---------- 3) Bul-Öğren ----------
  function renderCrossword(act, host, done, opts_ctx) {
    opts_ctx = opts_ctx || {};
    var items = (act.items || []).filter(function (w) { return w && w.answer && w.clue; });
    if (!items.length) { host.appendChild(el('div', 'eo-empty', 'Bu bulmacada henüz kelime yok.')); return; }

    var board = el('div');
    host.appendChild(board);
    var api = global.EOCrossword.render(board, items);

    var msg = el('div');
    host.appendChild(msg);

    var bar = el('div', 'eo-actions');
    var status = el('span', 'eo-counter', items.length + ' kelime');
    var check = el('button', 'eo-btn accent', 'Kontrol et');
    var reveal = el('button', 'eo-btn ghost sm', 'Çözümü göster');
    var clear = el('button', 'eo-btn ghost sm', 'Temizle');
    check.type = reveal.type = clear.type = 'button';
    // Yardım düğmeleri ilk denemeden önce görünmez; önce öğrenci denesin
    reveal.style.display = clear.style.display = 'none';

    check.addEventListener('click', function () {
      var r = api.check();
      status.innerHTML = '<b>' + r.solvedWords + '</b> / ' + r.words + ' kelime doğru';
      msg.innerHTML = '';
      if (r.cells.solved) {
        msg.appendChild(el('div', 'eo-cwdone', 'Tebrikler, bulmacayı tamamladınız!'));
        reveal.style.display = clear.style.display = 'none';
        done(1);
      } else {
        reveal.style.display = clear.style.display = '';
        msg.appendChild(el('div', 'eo-hintline', r.cells.filled < r.cells.total
          ? 'Boş kalan hücreler var. Doğru harfler yeşil, yanlışlar kırmızı işaretlendi.'
          : 'Yanlış harfler kırmızı işaretlendi; düzeltip yeniden kontrol edin.'));
      }
    });
    reveal.addEventListener('click', function () {
      api.reveal();
      status.textContent = 'Çözüm gösterildi';
      msg.innerHTML = '';
      done(0);
    });
    clear.addEventListener('click', function () {
      api.clear();
      status.textContent = items.length + ' kelime';
      msg.innerHTML = '';
    });

    bar.appendChild(status);
    bar.appendChild(el('span', 'eo-spacer'));
    bar.appendChild(clear);
    bar.appendChild(reveal);
    bar.appendChild(check);
    host.appendChild(bar);

    if (api && api.model && api.model.skipped.length) {
      host.appendChild(el('p', 'eo-hintline',
        'Izgaraya sığmayan kelimeler: ' + api.model.skipped.map(esc).join(', ')));
    }
  }

  // ---------- 4) Eşleştir-Öğren ----------
  function renderMatch(act, host, done, opts_ctx) {
    opts_ctx = opts_ctx || {};
    var items = (act.items || []).filter(function (p) { return p && p.term && p.definition; });
    if (!items.length) { host.appendChild(el('div', 'eo-empty', 'Bu etkinlikte henüz eşleştirme yok.')); return; }

    host.appendChild(el('p', 'eo-hintline',
      'Açıklamayı seçip karşısındaki kavram kutusuna tıklayın; masaüstünde sürükleyip bırakabilirsiniz.'));

    var wrap = el('div', 'eo-match');
    var leftCol = el('div', 'eo-match-col');
    leftCol.appendChild(el('h4', '', 'Açıklamalar'));
    var pool = el('div', 'eo-pool');
    leftCol.appendChild(pool);

    var rightCol = el('div', 'eo-match-col');
    rightCol.appendChild(el('h4', '', 'Kavramlar'));
    var slots = el('div', 'eo-pool');
    rightCol.appendChild(slots);

    wrap.appendChild(leftCol);
    wrap.appendChild(rightCol);
    host.appendChild(wrap);

    var selected = null;

    function makeChip(item, i) {
      var chip = el('button', 'eo-chip');
      chip.type = 'button';
      chip.draggable = true;
      chip.dataset.id = i;
      chip.innerHTML = rich(item.definition);
      chip.addEventListener('click', function () {
        if (selected === chip) { chip.classList.remove('is-selected'); selected = null; return; }
        if (selected) selected.classList.remove('is-selected');
        selected = chip; chip.classList.add('is-selected');
      });
      chip.addEventListener('dragstart', function (e) {
        selected = chip;
        chip.classList.add('is-dragging');
        try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {}
        e.dataTransfer.effectAllowed = 'move';
      });
      chip.addEventListener('dragend', function () { chip.classList.remove('is-dragging'); });
      return chip;
    }

    shuffle(items.map(function (it, i) { return { it: it, i: i }; }))
      .forEach(function (o) { pool.appendChild(makeChip(o.it, o.i)); });

    var drops = [];
    items.forEach(function (item, i) {
      var slot = el('div', 'eo-slot');
      slot.appendChild(el('div', 'eo-slot-term', rich(item.term)));
      var drop = el('div', 'eo-drop', 'buraya bırakın');
      drop.dataset.id = i;
      drop.tabIndex = 0;

      function place(chip) {
        if (!chip) return;
        if (drop.dataset.filled) returnChip(drop);
        drop.textContent = '';
        drop.appendChild(chip);
        chip.classList.remove('is-selected');
        drop.dataset.filled = chip.dataset.id;
        drop.classList.add('filled');
        selected = null;
        slot.classList.remove('is-ok', 'is-no');
        update();
      }
      function onActivate() {
        if (selected) { place(selected); return; }
        if (drop.dataset.filled) returnChip(drop);
      }
      drop.addEventListener('click', onActivate);
      drop.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
      drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('is-over'); });
      drop.addEventListener('dragleave', function () { drop.classList.remove('is-over'); });
      drop.addEventListener('drop', function (e) {
        e.preventDefault();
        drop.classList.remove('is-over');
        place(selected);
      });

      slot.appendChild(drop);
      slots.appendChild(slot);
      drops.push({ drop: drop, slot: slot, id: i });
    });

    function returnChip(drop) {
      var chip = drop.querySelector('.eo-chip');
      if (chip) pool.appendChild(chip);
      drop.textContent = 'buraya bırakın';
      delete drop.dataset.filled;
      drop.classList.remove('filled');
      drop.parentElement.classList.remove('is-ok', 'is-no');
      update();
    }

    var status = el('span', 'eo-counter');
    var wrongTries = 0;
    function update() {
      var filled = drops.filter(function (d) { return d.drop.dataset.filled != null; }).length;
      status.innerHTML = '<b>' + filled + '</b> / ' + items.length + ' eşleştirildi';
      check.disabled = filled !== items.length;
    }

    var bar = el('div', 'eo-actions');
    var reset = el('button', 'eo-btn ghost sm', 'Baştan');
    var reveal = el('button', 'eo-btn ghost sm', 'Çözümü göster');
    var check = el('button', 'eo-btn accent sm', 'Eşleştirmeleri kontrol et');
    reset.type = check.type = reveal.type = 'button';
    reveal.style.display = 'none';        // iki yanlış denemeden sonra açılır

    check.addEventListener('click', function () {
      var ok = 0;
      drops.forEach(function (d) {
        var correct = d.drop.dataset.filled === String(d.id);
        d.slot.classList.toggle('is-ok', correct);
        d.slot.classList.toggle('is-no', !correct);
        if (correct) ok++;
      });
      if (ok === items.length) {
        status.innerHTML = '<b>' + ok + '</b> / ' + items.length + ' doğru — tamamlandı';
        reveal.style.display = 'none';
        done(1);
        return;
      }
      wrongTries++;
      status.innerHTML = '<b>' + ok + '</b> / ' + items.length + ' doğru' +
        (wrongTries < 2 ? ' — yanlışları düzeltip yeniden deneyin' : '');
      if (wrongTries >= 2) reveal.style.display = '';
    });

    reveal.addEventListener('click', function () {
      // Her açıklamayı doğru kavramın kutusuna yerleştirir
      drops.forEach(function (d) {
        if (d.drop.dataset.filled != null) returnChip(d.drop);
      });
      drops.forEach(function (d) {
        var chip = pool.querySelector('.eo-chip[data-id="' + d.id + '"]');
        if (!chip) return;
        d.drop.textContent = '';
        d.drop.appendChild(chip);
        d.drop.dataset.filled = String(d.id);
        d.drop.classList.add('filled');
        d.slot.classList.add('is-ok');
        d.slot.classList.remove('is-no');
      });
      status.textContent = 'Çözüm gösterildi';
      reveal.style.display = 'none';
      check.disabled = true;
      done(0);
    });

    reset.addEventListener('click', function () {
      drops.forEach(function (d) { if (d.drop.dataset.filled != null) returnChip(d.drop); });
      Array.prototype.slice.call(pool.children).forEach(function (c) { c.classList.remove('is-selected'); });
      selected = null;
      update();
    });

    bar.appendChild(status);
    bar.appendChild(el('span', 'eo-spacer'));
    bar.appendChild(reset);
    bar.appendChild(reveal);
    bar.appendChild(check);
    host.appendChild(bar);
    update();
  }

  // ---------- 5) Dene-Öğren ----------
  function renderStudy(act, host, done, opts_ctx) {
    opts_ctx = opts_ctx || {};
    var items = (act.items || []).filter(function (m) { return m && (m.title || m.theory); });
    if (!items.length) { host.appendChild(el('div', 'eo-empty', 'Bu modülde henüz bölüm yok.')); return; }

    var idx = 0;
    var answers = new Array(items.length).fill(null);
    var picked = null;                       // onaylanmamış seçim
    var stage = el('div', 'eo-study');
    host.appendChild(stage);

    function draw() {
      stage.innerHTML = '';
      if (idx >= items.length) return drawDone();
      var m = items[idx];

      var nav = el('div', 'eo-study-nav');
      items.forEach(function (x, i) {
        var s = el('button', 'eo-step', String(i + 1).padStart(2, '0'));
        s.type = 'button';
        if (i === idx) s.setAttribute('aria-current', 'true');
        if (answers[i] != null) s.classList.add('done');
        s.addEventListener('click', function () { idx = i; picked = null; draw(); });
        nav.appendChild(s);
      });
      stage.appendChild(nav);

      if (m.category) stage.appendChild(el('div', 'eo-cat', esc(m.category)));
      stage.appendChild(el('h4', '', rich(m.title)));
      if (m.theory) stage.appendChild(el('p', 'eo-theory', rich(m.theory)));

      if (m.keyPoints && m.keyPoints.length) {
        var ul = el('ul', 'eo-keys');
        m.keyPoints.forEach(function (k, i) {
          var li = el('li', '', rich(k));
          li.setAttribute('data-n', String(i + 1).padStart(2, '0'));
          ul.appendChild(li);
        });
        stage.appendChild(ul);
      }

      if (m.question) {
        var qb = el('div', 'eo-quizbox');
        qb.appendChild(el('div', 'eo-qlabel', 'Kontrol sorusu'));
        qb.appendChild(el('p', 'eo-qtext', rich(m.question)));
        var opts = el('div', 'eo-options');
        var locked = answers[idx] != null;
        (m.options || []).forEach(function (t, i) {
          var b = el('button', 'eo-opt');
          b.type = 'button';
          b.innerHTML = '<span class="eo-bubble">' + (LETTERS[i] || i + 1) + '</span><span>' + rich(t) + '</span>';
          if (locked) {
            b.disabled = true;
            if (i === m.answer) b.classList.add('is-ok');
            else if (i === answers[idx]) b.classList.add('is-no');
          } else if (picked === i) {
            b.classList.add('is-picked');
            b.setAttribute('aria-pressed', 'true');
          }
          b.addEventListener('click', function () {
            if (answers[idx] != null) return;
            picked = (picked === i) ? null : i;
            draw();
          });
          opts.appendChild(b);
        });
        qb.appendChild(opts);

        if (locked) {
          var right = answers[idx] === m.answer;
          var fb = el('div', 'eo-feedback ' + (right ? 'is-ok' : 'is-no'));
          fb.appendChild(el('div', 'eo-fb-title', right
            ? 'Tebrikler, yanıtınız doğru!'
            : 'Yanıtınız yanlış! Doğru yanıt: ' + (LETTERS[m.answer] || '')));
          fb.appendChild(el('div', '', rich(m.explanation || (right
            ? 'Doğru seçeneği işaretlediniz.'
            : 'Doğru seçenek yukarıda yeşille gösterilmiştir.'))));
          qb.appendChild(fb);
        }
        stage.appendChild(qb);
      }

      var bar = el('div', 'eo-actions');
      var prev = el('button', 'eo-btn ghost sm', '← Önceki');
      prev.type = 'button'; prev.disabled = idx === 0;
      prev.addEventListener('click', function () { idx--; picked = null; draw(); });
      bar.appendChild(prev);
      bar.appendChild(el('span', 'eo-spacer'));

      if (m.question && answers[idx] == null) {
        var confirm = el('button', 'eo-btn accent', 'Yanıtı onayla');
        confirm.type = 'button';
        confirm.disabled = picked == null;
        confirm.addEventListener('click', function () {
          if (picked == null) return;
          answers[idx] = picked; picked = null; draw();
        });
        bar.appendChild(confirm);
      } else {
        var next = el('button', 'eo-btn', idx === items.length - 1 ? 'Modülü bitir' : 'Sonraki bölüm →');
        next.type = 'button';
        next.addEventListener('click', function () { idx++; picked = null; draw(); });
        bar.appendChild(next);
      }
      stage.appendChild(bar);
    }

    function drawDone() {
      var withQ = items.filter(function (m) { return !!m.question; });
      var correct = items.filter(function (m, i) { return m.question && answers[i] === m.answer; }).length;
      done(withQ.length ? correct / withQ.length : 1);
      stage.innerHTML = '';
      var d = el('div', 'eo-done');
      d.appendChild(el('div', 'eo-stamp', '✓'));
      d.appendChild(el('h4', '', 'Modül tamamlandı'));
      d.appendChild(el('p', '', withQ.length
        ? items.length + ' bölümü bitirdiniz, ' + withQ.length + ' kontrol sorusundan ' + correct + ' tanesini doğru yanıtladınız.'
        : items.length + ' bölümü bitirdiniz.'));
      var bar = el('div', 'eo-actions');
      bar.appendChild(el('span', 'eo-spacer'));
      var again = el('button', 'eo-btn accent', 'Baştan başla');
      again.type = 'button';
      again.addEventListener('click', function () {
        idx = 0; picked = null; answers = new Array(items.length).fill(null); draw();
      });
      bar.appendChild(again);
      bar.appendChild(el('span', 'eo-spacer'));
      d.appendChild(bar);
      stage.appendChild(d);
    }

    draw();
  }

  var RENDERERS = {
    cards: renderCards,
    quiz: renderQuiz,
    crossword: renderCrossword,
    match: renderMatch,
    study: renderStudy
  };

  /** Tek bir etkinliği kart kabuğuyla birlikte çizer. */
  function renderActivity(act, kind, host, opts) {
    opts = opts || {};
    var box = el('div', 'eo-activity');
    var earned = null;
    if (!opts.bare) {
      var head = el('div', 'eo-act-head');
      head.appendChild(el('span', 'eo-tag', KIND_LABEL[kind] || kind));
      head.appendChild(el('h3', '', esc(act.title || 'Etkinlik')));
      if (opts.onDone) {
        earned = el('span', 'eo-earned');
        earned.style.display = 'none';
        head.appendChild(earned);
        var tick = el('span', 'eo-act-tick', '✓');
        tick.title = 'Tamamlandı';
        head.appendChild(tick);
      }
      box.appendChild(head);
    }
    var body = el('div', 'eo-act-body');
    box.appendChild(body);
    host.appendChild(box);

    var fired = false;
    var done = function (score) {
      box.classList.add('is-complete');
      if (fired) return;
      fired = true;
      var pts = pointsFor(kind, score);
      if (earned) {
        earned.textContent = '+' + pts + ' puan';
        earned.style.display = '';
      }
      if (opts.onDone) opts.onDone(pts, score);
    };

    (RENDERERS[kind] || function () {
      body.appendChild(el('div', 'eo-empty', 'Bilinmeyen etkinlik türü: ' + esc(kind)));
    })(act, body, done, { award: opts.award || function () {} });

    if (opts.completed) {
      box.classList.add('is-complete');
      fired = true;
      if (earned && opts.earnedPoints) {
        earned.textContent = opts.earnedPoints + ' puan';
        earned.style.display = '';
      }
    }
    return box;
  }

  /** Tüm kursu kenar çubuğuyla birlikte kurar. */
  function mount(data, root, opts) {
    opts = opts || {};
    data = data || { meta: {}, lessons: [] };
    var lessons = data.lessons || [];
    var meta = data.meta || {};
    root.dataset.mounted = '1';   // DOMContentLoaded'daki otomatik kurulum tekrar çizmesin
    root.innerHTML = '';
    document.body.classList.add('eo-body');

    if (opts.single) {
      var lesson = lessons[opts.single.lesson] || lessons[0];
      var act = (lesson.activities || [])[opts.single.activity];
      if (act) renderActivity(act, lesson.kind, root, { bare: opts.bare });
      return;
    }

    var shell = el('div', 'eo-shell');
    var side = el('aside', 'eo-side');
    var brand = el('div', 'eo-brand');
    brand.innerHTML =
      '<div class="eo-eyebrow">' + esc(meta.eyebrow || 'etkileşimli çalışma seti') + '</div>' +
      '<h1>' + esc(meta.title || 'Çöz-Öğren') + '</h1>' +
      '<p>' + esc(meta.subtitle || '') + '</p>';
    side.appendChild(brand);

    var menuBtn = el('button', 'eo-menubtn', 'Bölümler');
    menuBtn.type = 'button';
    menuBtn.addEventListener('click', function () { side.classList.toggle('open'); });
    side.appendChild(menuBtn);

    // ---- Oyunlaştırma durumu ----
    var progKey = courseKey(data);
    var saved = store(progKey) || {};
    var doneMap = saved.done || saved;              // eski biçimle uyum
    if (typeof doneMap !== 'object' || doneMap === null) doneMap = {};
    var points = saved.points || 0;
    var earnedBadges = saved.badges || {};
    var earnedPts = saved.pts || {};

    var totalActs = 0;
    lessons.forEach(function (l) {
      (l.activities || []).forEach(function (a) { if ((a.items || []).length) totalActs++; });
    });

    function save() {
      store(progKey, { done: doneMap, points: points, badges: earnedBadges, pts: earnedPts });
    }

    // ---- Rütbe paneli ----
    var rank = el('div', 'eo-rank');
    rank.innerHTML =
      '<div class="eo-rank-top">' +
        '<div class="eo-rank-seal" data-seal>I</div>' +
        '<div class="eo-rank-info">' +
          '<div class="eo-rank-name" data-lvname>Başlangıç</div>' +
          '<div class="eo-rank-pts" data-pts>0 puan</div>' +
        '</div>' +
      '</div>' +
      '<div class="eo-rank-track"><i data-lvfill></i></div>' +
      '<div class="eo-rank-next" data-next></div>';
    side.appendChild(rank);

    function drawRank() {
      var lv = levelOf(points);
      rank.querySelector('[data-seal]').textContent = lv.level.mark;
      rank.querySelector('[data-lvname]').textContent = 'Seviye ' + (lv.index + 1) + ' · ' + lv.level.name;
      rank.querySelector('[data-pts]').textContent = trNum(points) + ' puan';
      var pct = 100, next = '';
      if (lv.next) {
        var span = lv.next.min - lv.level.min;
        pct = Math.max(0, Math.min(100, Math.round((points - lv.level.min) / span * 100)));
        next = lv.next.name + ' rütbesine ' + trNum(lv.next.min - points) + ' puan';
      } else { next = 'En üst rütbeye ulaştınız'; }
      rank.querySelector('[data-lvfill]').style.width = pct + '%';
      rank.querySelector('[data-next]').textContent = next;
    }

    // ---- İlerleme ----
    var prog = el('div', 'eo-progress');
    prog.innerHTML =
      '<div class="eo-prog-top"><span>İlerleme</span><b data-pct>%0</b></div>' +
      '<div class="eo-prog-track"><i data-fill></i></div>' +
      '<div class="eo-prog-meta"><span data-meta></span>' +
      '<button type="button" class="eo-prog-reset" data-reset>sıfırla</button></div>';
    side.appendChild(prog);

    function doneCount() { return Object.keys(doneMap).length; }
    function drawProgress() {
      var n = doneCount();
      var pct = totalActs ? Math.round(n / totalActs * 100) : 0;
      prog.querySelector('[data-pct]').textContent = '%' + pct;
      prog.querySelector('[data-fill]').style.width = pct + '%';
      prog.querySelector('[data-meta]').textContent = n + ' / ' + totalActs + ' etkinlik tamamlandı';
      prog.classList.toggle('is-full', totalActs > 0 && n >= totalActs);
    }
    prog.querySelector('[data-reset]').addEventListener('click', function () {
      doneMap = {}; points = 0; earnedBadges = {}; earnedPts = {};
      save(); drawRank(); drawProgress(); drawBadges(); draw();
    });

    // ---- Rozet vitrini ----
    var badgeBox = el('div', 'eo-badges');
    badgeBox.innerHTML = '<h4>Rozetler <span data-bcount></span></h4><div class="eo-badge-grid" data-bgrid></div>';
    side.appendChild(badgeBox);

    function drawBadges(newId) {
      var grid = badgeBox.querySelector('[data-bgrid]');
      grid.innerHTML = '';
      BADGES.forEach(function (b) {
        var got = !!earnedBadges[b.id];
        var cell = el('div', 'eo-badge' + (got ? ' is-earned' : '') + (b.id === newId ? ' is-new' : ''), icon(b.icon));
        cell.title = got ? b.name + ' — ' + b.desc : 'Kilitli: ' + b.desc;
        cell.setAttribute('aria-label', cell.title);
        grid.appendChild(cell);
      });
      badgeBox.querySelector('[data-bcount]').textContent =
        Object.keys(earnedBadges).length + '/' + BADGES.length;
    }

    function award(id) {
      if (earnedBadges[id]) return;
      var b = BADGES.filter(function (x) { return x.id === id; })[0];
      if (!b) return;
      earnedBadges[id] = Date.now();
      points += 25;
      save(); drawRank(); drawBadges(id);
      showAward(b);
    }

    // Aynı anda birden çok rozet kazanılabilir; bildirimler sırayla gösterilir.
    var awardQueue = [], awardShowing = false, awardTimer = null, awardHide = null;
    function showAward(b) {
      awardQueue.push(b);
      if (!awardShowing) { nextAward(); return; }
      // Sıradaki varken görünendeki bekleme kısalır, kuyruk tıkanmaz
      clearTimeout(awardTimer);
      awardTimer = setTimeout(awardHide, 1400);
    }
    function nextAward() {
      var b = awardQueue.shift();
      if (!b) { awardShowing = false; return; }
      awardShowing = true;
      var card = el('div', 'eo-award');
      card.setAttribute('role', 'status');
      card.innerHTML =
        '<div class="eo-award-seal">' + icon(b.icon) + '</div>' +
        '<div><div class="eo-award-kicker">Rozet kazanıldı · +25 puan</div>' +
        '<div class="eo-award-name">' + esc(b.name) + '</div>' +
        '<div class="eo-award-desc">' + esc(b.desc) + '</div></div>';
      document.body.appendChild(card);
      requestAnimationFrame(function () { card.classList.add('show'); });
      awardHide = function () {
        card.classList.remove('show');
        setTimeout(function () { card.remove(); nextAward(); }, 400);
      };
      clearTimeout(awardTimer);
      awardTimer = setTimeout(awardHide, awardQueue.length ? 2200 : 5000);
    }

    /** Bir bölümün tamamı bitti mi, tüm set bitti mi diye bakar. */
    function checkMilestones() {
      var allDone = totalActs > 0 && doneCount() >= totalActs;
      if (allDone) award('set-tamam');
      lessons.forEach(function (l, i) {
        var acts = (l.activities || []).filter(function (a) { return (a.items || []).length; });
        if (!acts.length) return;
        var d = acts.filter(function (a, ai) { return doneMap[i + ':' + ai]; }).length;
        if (d < acts.length) return;
        if (l.kind === 'cards') award('kart-ustasi');
        if (l.kind === 'quiz') award('test-tamam');
      });
    }

    function markDone(key, pts, kind, score) {
      if (doneMap[key]) return;
      doneMap[key] = 1;
      earnedPts[key] = pts;
      points += pts;
      save();
      award('ilk-adim');
      if (kind === 'crossword' && score === 1) award('bulmaca');
      if (kind === 'match' && score === 1) award('eslestirme');
      checkMilestones();
      drawRank(); drawProgress(); drawNav(); drawBadges();
    }

    var nav = el('ul', 'eo-nav');
    side.appendChild(nav);
    if (meta.footer) side.appendChild(el('div', 'eo-side-foot', esc(meta.footer)));

    var main = el('main', 'eo-main');
    var wrap = el('div', 'eo-wrap');
    main.appendChild(wrap);

    shell.appendChild(side);
    shell.appendChild(main);
    root.appendChild(shell);

    var current = 0;

    function drawNav() {
      nav.innerHTML = '';
      lessons.forEach(function (l, i) {
        var acts = (l.activities || []).filter(function (a) { return (a.items || []).length; });
        var d = acts.filter(function (a, ai) { return doneMap[i + ':' + ai]; }).length;
        var li = el('li');
        var b = el('button');
        b.type = 'button';
        if (acts.length && d >= acts.length) b.classList.add('is-done');
        b.innerHTML = '<span class="eo-num">' + (acts.length && d >= acts.length ? '✓' : String(i + 1).padStart(2, '0')) + '</span>' +
          '<span>' + esc(l.title) +
          '<span class="eo-navmeta">' + (acts.length ? d + ' / ' + acts.length + ' tamamlandı' : 'içerik yok') + '</span></span>';
        if (i === current) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () {
          current = i; side.classList.remove('open'); draw();
          main.scrollIntoView({ block: 'start', behavior: 'smooth' });
        });
        li.appendChild(b);
        nav.appendChild(li);
      });
    }

    function draw() {
      drawRank();
      drawProgress();
      drawBadges();
      drawNav();
      wrap.innerHTML = '';
      var l = lessons[current];
      if (!l) { wrap.appendChild(el('div', 'eo-empty', 'Bu pakette henüz bölüm yok.')); return; }

      var head = el('div', 'eo-lessonhead');
      head.innerHTML =
        '<div class="eo-kicker">Bölüm ' + String(current + 1).padStart(2, '0') + ' · ' + esc(KIND_LABEL[l.kind] || '') + '</div>' +
        '<h2>' + esc(l.title) + '</h2>' +
        '<p>' + esc(l.intro || '') + '</p>';
      wrap.appendChild(head);

      var acts = (l.activities || []).filter(function (a) { return (a.items || []).length; });
      if (!acts.length) {
        wrap.appendChild(el('div', 'eo-empty', 'Bu bölümde gösterilecek etkinlik yok.'));
      }
      acts.forEach(function (act, ai) {
        var key = current + ':' + ai;
        renderActivity(act, l.kind, wrap, {
          completed: !!doneMap[key],
          earnedPoints: earnedPts[key],
          award: award,
          onDone: function (pts, score) { markDone(key, pts, l.kind, score); }
        });
      });

      var bar = el('div', 'eo-actions');
      if (current > 0) {
        var p = el('button', 'eo-btn ghost', '← ' + lessons[current - 1].title);
        p.type = 'button';
        p.addEventListener('click', function () { current--; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        bar.appendChild(p);
      }
      bar.appendChild(el('span', 'eo-spacer'));
      if (current < lessons.length - 1) {
        var n = el('button', 'eo-btn', lessons[current + 1].title + ' →');
        n.type = 'button';
        n.addEventListener('click', function () { current++; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        bar.appendChild(n);
      }
      wrap.appendChild(bar);
    }

    draw();
    return { goTo: function (i) { current = i; draw(); } };
  }

  global.EO = { mount: mount, renderActivity: renderActivity, KIND_LABEL: KIND_LABEL, esc: esc, rich: rich };

  if (typeof document !== 'undefined') {
    document.addEventListener('DOMContentLoaded', function () {
      var root = document.getElementById('eo-root');
      if (root && global.EO_DATA && !root.dataset.mounted) {
        root.dataset.mounted = '1';
        mount(global.EO_DATA, root);
      }
    });
  }
})(window);
</script>
<script>EO.mount(window.EO_DATA,document.getElementById('eo-root'),{single:{"lesson":0,"activity":0}});</script>
</body></html>
