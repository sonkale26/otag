<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AKADEMİK İLETİŞİMDE ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b27;--card2:#1e2535;
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --t:#dde3f5;--t2:#8892b0;--t3:#4a5275;
  --ac:#4f8ef7;--ac2:#3a6fd8;
}

[data-theme="light"] {
  --bg:#e2e8f0;--card:#ffffff;--card2:#f1f5f9;
  --b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.14);
  --t:#0f172a;--t2:#475569;--t3:#64748b;
}

html,body{height:100%;height:100dvh;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex}

/* THEME TOGGLE (PLAYER) */
.pl-theme-btn {
  position:absolute; top:20px; right:20px; width:40px; height:40px;
  border-radius:50%; background:var(--card2); border:1px solid var(--b);
  color:var(--t); font-size:1.1rem; display:flex; align-items:center;
  justify-content:center; cursor:pointer; transition:.2s; z-index:50;
}
.pl-theme-btn:hover { background:var(--b); transform:scale(1.05); }
@media(max-width:768px){.pl-theme-btn{top:16px;right:16px;width:36px;height:36px;font-size:1rem;background:var(--card);}}

/* RESPONSIVE LAYOUT */
.sidebar { width:340px; background:var(--card); border-right:1px solid var(--b); display:flex; flex-direction:column; z-index:10; }
.main-view { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); position:relative; min-width:0; }

/* HEADER & TOC */
.hdr{padding:24px 24px 16px;flex-shrink:0}
.hdr-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);font-weight:700;margin-bottom:8px}
.hdr-title{font-size:1.4rem;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.toc{flex:1;overflow-y:auto;padding:0 0 16px}
.toc::-webkit-scrollbar{width:4px}
.toc::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.toc-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 24px;cursor:pointer;transition:background .15s;
  border-left:3px solid transparent;
}
.toc-item:hover{background:rgba(79,142,247,.06)}
.toc-item.active{background:rgba(79,142,247,.1);border-left-color:var(--ac)}
.toc-num{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;
  background:var(--card2);color:var(--t3);border:1px solid var(--b2);
  transition:.15s;
}
.toc-item.active .toc-num{
  background:var(--ac);color:#fff;border-color:var(--ac);
  box-shadow:0 0 0 4px rgba(79,142,247,.2);
}
.toc-item.active .toc-num-inner{display:none}
.toc-item.active .toc-num::before{content:'🔊';font-size:.8rem}
.toc-label{font-size:.85rem;font-weight:500;color:var(--t2);line-height:1.4;flex:1;transition:.15s}
.toc-item.active .toc-label{color:var(--ac);font-weight:700}
.toc-item.done .toc-num{background:rgba(46,204,133,.15);color:#34d399;border-color:rgba(46,204,133,.3)}

/* PLAYER CARD */
.player-card {
  width:100%; max-width:480px;
  background:var(--card); padding:40px;
  border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  border:1px solid var(--b);
  text-align:center;
}
.cover-art {
  width:120px; height:120px; border-radius:20px;
  background:linear-gradient(135deg, rgba(79,142,247,.1), rgba(155,108,247,.1));
  border:1px solid var(--b);
  margin:0 auto 24px; display:flex; align-items:center; justify-content:center;
  font-size:3rem; color:var(--ac);
}
.now-title{font-size:1.1rem;font-weight:700;margin-bottom:20px;line-height:1.4;color:var(--t)}
.progress{margin-bottom:12px}
.prog-track{
  height:6px;background:rgba(255,255,255,.1);border-radius:3px;
  cursor:pointer;position:relative;
}
.prog-fill{
  height:6px;background:var(--ac);border-radius:3px;
  width:0%;pointer-events:none;
  transition:width .25s linear;
}
.times{display:flex;justify-content:space-between;font-size:.7rem;color:var(--t3);margin-top:8px;font-weight:600}
.ctrls{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:20px}
.ctrl-btn{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--t2);transition:.15s;
}
.ctrl-btn:hover{color:var(--t); background:rgba(255,255,255,.05)}
.ctrl-btn svg{width:24px;height:24px;fill:currentColor}
.skip-btn{position:relative}
.skip-label{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:.6rem;color:var(--t3);white-space:nowrap;font-weight:600;
}
.play-btn{
  width:64px;height:64px;border-radius:50%;
  background:var(--ac);color:#fff;font-size:24px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(79,142,247,.4);transition:.15s;
}
.play-btn:hover{background:var(--ac2);box-shadow:0 10px 30px rgba(79,142,247,.5)}
.play-btn:active{transform:scale(.95)}

/* MOBILE ADAPTATION */
@media(max-width: 768px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; flex: 1; border-right: none; border-bottom: 1px solid var(--b); min-height: 0; }
  .main-view { flex: none; align-items: stretch; justify-content: flex-end; padding: 0; background: transparent; width: 100%; z-index: 20; }
  .player-card { max-width: 100%; border-radius: 0; padding: 16px 20px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); border: none; border-top: 1px solid var(--b); box-shadow: 0 -10px 30px rgba(0,0,0,.5); background: var(--card2); margin: 0; }
  .cover-art { display: none; } 
  .now-title { font-size: 1rem; margin-bottom: 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align: center; }
  .ctrls { gap: 20px; margin-top: 12px; }
  .play-btn { width: 56px; height: 56px; }
  .ctrl-btn svg { width: 24px; height: 24px; }
  .skip-label { bottom: -14px; }
}
</style>
</head>

      </button>

  </div>
</main>

<script>
// TEMA YÖNETİMİ
function initPlayerTheme() {
  const saved = localStorage.getItem('sd-theme');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  if (saved === 'light' || (!saved && prefersLight)) {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('pl-theme-btn').textContent = '☀️';
  }
}
function togglePlayerTheme() {
  const el = document.documentElement;
  if (el.getAttribute('data-theme') === 'light') {
    el.removeAttribute('data-theme');
    localStorage.setItem('sd-theme', 'dark');
    document.getElementById('pl-theme-btn').textContent = '🌙';
  } else {
    el.setAttribute('data-theme', 'light');
    localStorage.setItem('sd-theme', 'light');
    document.getElementById('pl-theme-btn').textContent = '☀️';
  }
}
initPlayerTheme();

E ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ","id":"1_2","title":"1.1. AKADEMİK ARAŞTIRMALARDA YAPAY ZEKÂNIN TARİHSEL GELİŞİMİ","text":"Akademik yazım ve araştırma süreçleri, tarih boyunca teknolojinin gelişimiyle doğrudan bağlantılı olarak dönüşüm geçirmiştir\\. Nitekim geleneksel olarak bir akademik çalışma üretmek; fiziksel kütüphanelerde günlerce süren literatür taramalarını, indeks kartlarına alınan notları ve daktilolarla yazılan uzun taslakları içeriyordu\\. 1990'lı yıllarda interneter ve dijital veri tabanlarının yaygınlaşması, bilgiye erişim hızını artırarak akademik iletişimin ilk büyük dijital devrimini başlatmıştır\\. Ancak bu dönemde bilgisayarlar yalnızca bilgiyi depolayan ve arandığında önümüze getiren pasif araçlardı\\. Teknolojinin metin üretimine veya dilin düzeltilmesine aktif bir şekilde katılması çok daha sonra gerçekleşmiştir\\. Yapay zekânın akademik dünyadaki ilk izleri, Doğal Dil İşleme \\(NLP \\- Natural Language Processing\\) teknolojilerinin gelişmesiyle görülmeye başlanmıştır\\. İlk aşamada kural tabanlı yazım ve dilbilgisi denetleyicileri araştırmacıların kullanımına girmiş, ardından makine öğrenmesi destekli dijital yazım asistanları ortaya çıkmıştır\\. Bu araçlar, özellikle ana dili İngilizce olmayan araştırmacılara cümle yapısını düzeltme ve okunabilirliği artırma konusunda önemli kolaylık sağlamıştır\\. Ancak bu sistemler, temelde mevcut metni iyileştirmeye odaklanmış; sıfırdan fikir ya da yeni metin üretememiştir\\. Asıl kırılma, 2017’de “Transformer” mimarisinin tanıtılması ve ardından büyük dil modellerinin \\(LLM\\) geliştirilmesiyle yaşanmıştır\\. OpenAI’ın kullanıma sunduğu ChatGPT gibi araçlar, kısa sürede milyonlarca kullanıcıya ulaşarak akademik dünyada güçlü bir etki oluşturmuştur\\. ChatGPT, Google Gemini ve Claude gibi sistemler; verilen bir komut doğrultusunda saniyeler içinde taslak metin yazabilen, karmaşık makaleleri özetleyebilen ve kod üretebilen yapılara sahiptir\\. Böylece bilgisayar, yalnızca bir arama motoru olmaktan çıkmış, araştırma sürecine katılan etkileşimli bir asistana dönüşmüştür\\. Türkiye’de de bu dönüşüm hızla karşılık bulmuştur\\. YÖK, TÜBİTAK ve MEB gibi kurumlar, yapay zekânın akademik araştırmalardaki yükselişini görerek Ulusal Yapay Zekâ Stratejisi \\(2021\\-2025\\) doğrultusunda politikalar geliştirmiştir\\. Bugün üniversite öğrencileri ve akademisyenler, literatür taraması, veri analizi ve taslak oluşturma süreçlerinde bu araçları küresel ölçekteki meslektaşlarıyla eş zamanlı kullanmaktadır\\. Bu tarihsel geçiş, bilginin üretilme hızını önemli ölçüde artırmıştır\\. Geçmişte haftalar süren veri analizi ya da literatür taramaları, bugün gelişmiş yapay zekâ asistanları sayesinde saatler, hatta dakikalar içinde tamamlanabilmektedir\\.","audio_file":"audio/1_2.wav"},{"chapterTitle":"AKADEMİK İLETİŞİMDE ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ","id":"1_3","title":"1.2. ÜYZ NEDİR?","text":"ÜYZ, büyük miktardaki veriyi \\(metin, görsel, ses\\) analiz ederek öğrenen ve kullanıcıdan aldığı komutlar \\(prompt\\) doğrultusunda daha önce var olmayan yeni içerikler üretebilen gelişmiş sistemlerdir\\. Bu sistemlerin temelinde çoğunlukla LLM’ler ve görsel üretiminde kullanılan difüzyon modelleri bulunmaktadır\\. Metin temelli sistemler, çok büyük veri kümeleri üzerinden insan dilinin yapısını ve kelimeler arasındaki ilişkileri öğrenmekte; kendilerine yöneltilen komutlara uygun biçimde anlamlı, akıcı ve özgün içerikler oluşturabilmektedir\\. __Tanım:__ ÜYZ, büyük veri kümelerinden öğrenerek kullanıcı komutlarına göre yeni metin, görsel ve ses içerikleri üretebilen yapay zekâ sistemleridir\\. Akademik çalışmalarda kullanılan ÜYZ araçları yalnızca metin üretmekle sınırlı değildir\\. Bu araçlar, metinleri farklı dillere çevirebilmekte, uzun araştırma makalelerini özetleyebilmekte, veri analizi için gerekli kodları yazabilmekte ve gerektiğinde görsel içerikler tasarlayabilmektedir\\. Bu yönüyle ÜYZ, yalnızca belirli kalıpları tekrar eden bir yazılım değil; üretim ve sentez yapabilen bilişsel bir teknoloji niteliği taşımaktadır\\. ÜYZ’yi daha iyi anlayabilmek için, onu geleneksel yapay zekâdan ayıran temel farklara değinmek gerekmektedir\\. Bu fark, öncelikle sistemin amacında ortaya çıkmaktadır\\. Zira geleneksel yapay zekâ daha çok analiz, sınıflandırma ve tahmin işlemlerine odaklanırken; ÜYZ yeni içerik üretmektedir\\. Diğer bir deyişle birinci fark, analiz ve üretim ayrımıdır\\. Geleneksel yapay zekâ, mevcut veriler içindeki örüntüleri belirleyerek sınıflandırma yapmaktadır\\. Örneğin bir e\\-postanın gereksiz olup olmadığını belirleyen sistem, var olan içeriği etiketlemekte; yeni bir metin oluşturmamaktadır\\. Buna karşılık ÜYZ, verilen komuta göre sıfırdan özgün bir e\\-posta, özet ya da metin taslağı yazabilmektedir\\. Akademik bağlamda da veri setinin analiz edilmesi geleneksel yapay zekâ ile ilişkilendirilebilirken, bulgular bölümüne taslak hazırlanması ÜYZ’nin alanına girmektedir\\. İkinci fark ise veri ve çıktı ilişkisinde görülmektedir\\. Geleneksel yapay zekâ sistemleri, belirli görevler için eğitilmekte ve çoğunlukla sınırlı çıktılar üretmektedir\\. ÜYZ ise geniş veri havuzlarıyla eğitilen temel modeller üzerine kurulduğu için özetleme, dil düzeltme, çeviri ve kod yazma gibi çok farklı görevleri yerine getirebilmektedir\\. Bu nedenle akademik dünyada ÜYZ, araştırmacıya yalnızca analiz aşamasında değil; okuma, düşünme ve yazma süreçlerinde de eşlik eden bir yardımcıya dönüşmektedir\\. __Dikkat:__ Geleneksel yapay zekâ ile ÜYZ arasındaki temel fark, yapay zekânın veriyi yorumlaması değil, yeni içerik üretebilmesidir\\.","audio_file":"audio/1_3.wav"},{"chapterTitle":"AKADEMİK İLETİŞİMDE ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ","id":"1_4","title":"1.3. AKADEMİK YAZIMDA ÜYZ ARAÇLARININ YAYGIN KULLANIM ALANLARI VE FIRSATLAR","text":"ÜYZ’nin akademik yazım süreçlerine dâhil olması, üniversite öğrencileri ve araştırmacıların daha önce saatler ya da günler alan birçok görevi çok daha kısa sürede tamamlayabilmesine olanak sağlamıştır\\. Bu teknolojilerin doğru ve etik çerçevede kullanılması, araştırma süreçlerinde önemli fırsatlar sunmaktadır\\. Üniversite öğrencilerinin araştırma yaparken karşılaştığı başlıca güçlükler arasında konuyu sınırlandırma, uygun kaynaklara ulaşma, karmaşık bilimsel metinleri sentezleme ve fikirleri akademik bir dille ifade etme yer almaktadır\\. ÜYZ araçları, bu noktada çok yönlü bir akademik asistan gibi işlev görmektedir\\. Yaygın kullanım alanlarının başında fikir geliştirme ve taslak oluşturma gelmektedir\\. Özellikle bir ödev ya da araştırma metnine nasıl başlanacağını bilememe durumu, öğrenciler için önemli bir engel oluşturmaktadır\\. ChatGPT veya Gemini gibi araçlar, bu aşamada bir tartışma ortağı gibi çalışarak potansiyel alt başlıklar, araştırma soruları ve makale iskeletleri oluşturmaya yardımcı olmaktadır\\. Böylece yazım süreci daha planlı ve hızlı ilerleyebilmektedir\\. Bir diğer önemli kullanım alanı literatür taraması ve özetlemedir\\. Geleneksel yöntemlerde çok sayıda makalenin okunması zaman alıcıdır\\. Günümüzde yapay zekâ araçları, uzun metinlerin temel fikirlerini kısa sürede özetleyebilmekte ve araştırmacıların ilgili kaynakları daha hızlı değerlendirmesine katkı sunmaktadır\\. Bununla birlikte, üretilen özetlerin ve önerilen kaynakların mutlaka özgün metinler üzerinden doğrulanması gerekmektedir\\. Dil, üslup düzeltme ve çeviri de ÜYZ’nin en yaygın kullanıldığı alanlardan biridir\\. Grammarly, DeepL, Trinka AI ve benzeri araçlar; dilbilgisi hatalarını düzeltme, cümleleri akademik bir tona uygun hâle getirme ve metnin okunabilirliğini artırma konusunda önemli destek sağlamaktadır\\. Ayrıca metinlerin anlamını koruyarak daha akıcı biçimde yeniden yazılması da bu araçların sık kullanılan işlevleri arasındadır\\. __Bilgi:__ ÜYZ, akademik yazım sürecinde fikir geliştirme, özetleme, dil düzeltme ve çeviri gibi alanlarda önemli destek sunmaktadır\\. Türkiye bağlamında değerlendirildiğinde, ÜYZ özellikle dil engelinin aşılmasında dikkat çekici fırsatlar sunmaktadır\\. Akademik iletişimin küresel dili olan İngilizceyi her öğrencinin aynı yeterlilik düzeyinde kullanamaması, uzun yıllar önemli bir sınırlılık oluşturmuştur\\. ÜYZ araçları, metinleri hedef dile daha doğal biçimde çevirebilmekte ve basit düzeyde yazılmış ifadeleri daha akademik bir yapıya kavuşturabilmektedir\\. Bu durum, öğrencilerin özgün fikirlerini daha tutarlı ve kurallı bir akademik metne dönüştürmelerini kolaylaştırmakta ve fırsat eşitliğine katkı sağlamaktadır\\. Sonuç olarak ÜYZ, formatlama, çeviri ve yazım denetimi gibi tekrara dayalı süreçleri otomatikleştirerek öğrencilerin eleştirel düşünme ve analiz gibi daha nitelikli zihinsel süreçlere daha fazla zaman ayırmasına imkân tanımaktadır\\. Ancak bütün bu kolaylıklara rağmen, araştırma sürecinde insanın eleştirel denetimi ve doğruluğu teyit etme sorumluluğu her zaman merkezde kalmalıdır\\.","audio_file":"audio/1_4.wav"},{"chapterTitle":"AKADEMİK İLETİŞİMDE ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ","id":"1_5","title":"Örnek Olay: Akademik Yazımda Dijital Asistanın Fırsatları ve Etik Sınırları","text":"Tahmini etkinliği tamamlama süresi: 10\\-15 dakika\\. Senaryo: Lisans son sınıf öğrencisi Ayşe, \"Yenilenebilir Enerji Politikaları\" üzerine bitirme tezi hazırlamaktadır\\. Konusunu belirlemiş ancak yoğun bilgi yığını karşısında nereden başlayacağını bilemediği için yazar tıkanıklığı \\(writer's block\\) yaşamaktadır\\. Fikirlerini toparlamak ve zaman kazanmak için ChatGPT'den yararlanmaya karar verir\\. Sisteme, *\"Yenilenebilir enerji politikaları hakkında bir lisans tezi yazacağım, bana Giriş, Yöntem ve Tartışma bölümlerini içerecek hiyerarşik bir iskelet \\(outline\\) önerir misin?\"* komutunu girer\\. Yapay zekânın sunduğu taslağı inceler, kendi araştırma sınırlarına uymayan kısımları siler ve taslağı kendi entelektüel hedeflerine göre yeniden düzenler\\. Metnin yazım aşamasında içeriği tamamen kendi araştırmalarıyla, kendi cümlelerini kullanarak yazar\\. Çalışması bittiğinde, tezinin İngilizce özet \\(abstract\\) kısmını yazarken İngilizcesinin yeterince akademik olmadığını düşünür\\. Bu nedenle yapay zekâya *\"Bu paragraftaki dilbilgisi hatalarını düzelt ve cümleleri akademik bir tona dönüştür\"* komutunu vererek aracı bir \"dil editörü\" gibi kullanır\\. Tezi teslim ederken, \"Beyanlar\" bölümüne yapay zekâyı tez iskeleti oluşturma ve İngilizce dil denetimi aşamalarında kullandığını şeffaf bir biçimde ekler\\.","audio_file":"audio/1_5.wav"},{"chapterTitle":"AKADEMİK İLETİŞİMDE ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ","id":"1_6","title":"Durum Tespiti:","text":"Araştırma ve yazım sürecindeki boyutlar şu şekilde analiz edilmiştir: \\- __Yapısal Boyut \\(Fikir Üretimi ve İskelet\\):__ Ayşe, araştırma sürecinin başında zihinsel yükünü hafifletmek, kavramları organize etmek ve mantıksal bir akış kurmak için ÜYZ'yi bir beyin fırtınası aracı olarak kullanmıştır\\. \\- __Dilsel Boyut \\(Gramer ve Akıcılık\\):__ Anadili İngilizce olmayan \\(EFL\\) bir öğrenci olarak Ayşe, uluslararası standartlara uygun bir metin üretebilmek için yapay zekânın sözdizimi düzeltme ve çeviri kapasitesinden destek almış; böylece dil bariyerini aşmıştır\\. \\- __Etik Boyut \\(Şeffaflık ve İnsan Gözetimi\\):__ Ayşe, projenin entelektüel çekirdeğini \\(de novo metin üretimi\\) makineye devretmemiş; yapay zekâyı yalnızca bir \"asistan\" olarak kullanmış ve sürece insan gözetimiyle \\(human\\-in\\-the\\-loop\\) müdahale etmiştir\\. __Fırsat ve Çözüm Durumu:__ Yazar \\(Ayşe\\), teknolojik araçları akademik dürüstlük sınırları içinde kalarak büyük bir fırsata çevirmiştir\\. Zaman alıcı yapısal düzenlemeler ve dilsel düzeltmeler için makine otomasyonundan faydalanırken; eleştirel düşünme, verileri yorumlama ve özgün içerik üretme \\(hususiyet\\) sorumluluğunu kendi zihninde tutarak hem \"bilişsel körelme\" riskinden kaçınmış hem de başarılı ve şeffaf bir bilimsel çalışma ortaya koymuştur\\.","audio_file":"audio/1_6.wav"},{"chapterTitle":"AKADEMİK İLETİŞİMDE ÜRETKEN YAPAY ZEKÂNIN GELİŞİMİ VE POTANSİYELİ","id":"1_7","title":"Tartışma Soruları:","text":"Bu senaryoyu analiz etmek için aşağıdaki soruları yanıtlayın: 1\\. __Yazar Tıkanıklığının Aşılması:__ Akademik makale yazımı karmaşık ve zorlayıcı bir süreçtir\\. Ayşe'nin çalışmasının başında sadece bir makale iskeleti \\(outline\\) oluşturmak için yapay zekâdan destek alması, onun zaman yönetimini ve motivasyonunu nasıl etkilemiş olabilir? 2\\. __Fırsat Eşitliği ve Dil Bariyeri:__ Ayşe'nin İngilizce özet kısmında yapay zekâyı bir \"dil editörü\" veya çevirmen gibi kullanması, akademik iletişimde \\(özellikle anadili İngilizce olmayan EFL öğrencileri için\\) nasıl bir fırsat eşitliği yaratmaktadır? 3\\. __Entelektüel Sınırların Korunması:__ Eğer Ayşe, sadece bir iskelet istemek yerine *\"Bana yenilenebilir enerji hakkında 10 sayfalık b [metin kısaltıldı]","audio_file":"audio/1_7.wav"}];
const ap = document.getElementById('ap');
let cur = 0, playing = false, spd = 1, doneSet = new Set();

function fmt(s) {
  s = Math.floor(s || 0);
  return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}

function buildTOC() {
  const toc = document.getElementById('toc');
  CHUNKS.forEach((cu, i) => {
    const row = document.createElement('div');
    row.className = 'toc-item' + (i === 0 ? ' active' : '');
    row.id = 'ti' + i;
    row.onclick = () => loadTrack(i, false);
    row.innerHTML = '<div class="toc-num"><span class="toc-num-inner">' + (i + 1) + '</span></div>' +
                    '<div class="toc-label">' + (cu.title || cu.chapterTitle || ('Parça ' + (i+1))) + '</div>';
    toc.appendChild(row);
  });
}

function loadTrack(idx, autoPlay) {
  if (idx < 0 || idx >= CHUNKS.length) return;
  const wasPlaying = playing;
  if (!ap.paused) { ap.pause(); playing = false; }
  cur = idx;
  const cu = CHUNKS[idx];

  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    if (i === idx) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  document.getElementById('now-title').textContent = cu.title || cu.chapterTitle || ('Parça ' + (idx+1));
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('t-cur').textContent = '00:00';
  document.getElementById('t-dur').textContent = '00:00';
  document.getElementById('play-btn').textContent = '▶';

  if (cu.audio_file) {
    ap.src = cu.audio_file;
    ap.playbackRate = spd;
    if (autoPlay || wasPlaying) doPlay();
  }
  localStorage.setItem('sd-pos', idx);
}

function doPlay() {
  ap.play().then(() => {
    playing = true;
    document.getElementById('play-btn').textContent = '⏸';
  }).catch(() => {});
}

function togglePlay() {
  if (playing) { ap.pause(); playing = false; document.getElementById('play-btn').textContent = '▶'; }
  else doPlay();
}

function nextTrack() { loadTrack(cur + 1, true); }
function prevTrack() {
  if (ap.currentTime > 3) { ap.currentTime = 0; return; }
  loadTrack(cur - 1, playing);
}
function skipTime(s) { ap.currentTime = Math.max(0, Math.min(ap.duration || 0, ap.currentTime + s)); }
function seek(e) {
  if (!ap.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  ap.currentTime = ((e.clientX - r.left) / r.width) * ap.duration;
}

ap.addEventListener('timeupdate', () => {
  if (!ap.duration) return;
  document.getElementById('prog-fill').style.width = (ap.currentTime / ap.duration * 100) + '%';
  document.getElementById('t-cur').textContent = fmt(ap.currentTime);
  document.getElementById('t-dur').textContent = fmt(ap.duration);
});
ap.addEventListener('ended', () => {
  doneSet.add(cur);
  document.getElementById('ti' + cur)?.classList.add('done');
  nextTrack();
});

buildTOC();
const savedPos = parseInt(localStorage.getItem('sd-pos') || '0');
loadTrack(Math.min(savedPos, CHUNKS.length - 1), false);
</script>
