  seg.style.left=(it.start/tot*100)+"%";seg.style.width=((it.end-it.start)/tot*100)+"%";
}
function goTo(i,play){if(i<0||i>=ITEMS.length)return;setActive(i);seekTo(ITEMS[i].start);if(play)doPlay();}
function seekTo(t){if(!ap.duration||isNaN(ap.duration)){seeking=t;return;}try{ap.currentTime=t;}catch(e){seeking=t;}}
function doPlay(){ap.playbackRate=spd;ap.play().then(function(){playing=true;document.getElementById("play-btn").textContent="⏸";}).catch(function(){if(ap.error)showAudErr();});}
function togglePlay(){if(playing){ap.pause();playing=false;document.getElementById("play-btn").textContent="▶";}else doPlay();}
function nextTrack(){goTo(cur+1,true);}
function prevTrack(){var it=ITEMS[cur];if(it&&ap.currentTime-it.start>3){seekTo(it.start);return;}goTo(cur-1,playing);}
function skipTime(s){seekTo(Math.max(0,Math.min(ap.duration||D.total,ap.currentTime+s)));}
function seek(e){var d=ap.duration||D.total;if(!d)return;var r=e.currentTarget.getBoundingClientRect();seekTo((e.clientX-r.left)/r.width*d);}
function cycleSpeed(){var i=SPEEDS.indexOf(spd);spd=SPEEDS[(i+1)%SPEEDS.length];ap.playbackRate=spd;document.getElementById("spd-btn").textContent=spd.toFixed(2).replace(/0$/,"")+"×";}
ap.addEventListener("loadedmetadata",function(){if(seeking!==false){var t=seeking;seeking=false;ap.currentTime=t;}document.getElementById("t-dur").textContent=fmt(ap.duration||D.total);});
ap.addEventListener("timeupdate",function(){
  var d=ap.duration||D.total;if(!d)return;
  document.getElementById("prog-fill").style.width=(ap.currentTime/d*100)+"%";
  document.getElementById("t-cur").textContent=fmt(ap.currentTime);
  document.getElementById("t-dur").textContent=fmt(d);
  var i=indexAt(ap.currentTime);
  if(i!==cur){if(cur>=0&&i>cur){doneSet[cur]=1;var pe=document.getElementById("ti"+cur);if(pe)pe.classList.add("done");}setActive(i);}
  if(ap.currentTime>maxTime){maxTime=ap.currentTime;saveProgress(d);}
});
ap.addEventListener("ended",function(){playing=false;document.getElementById("play-btn").textContent="▶";var pe=document.getElementById("ti"+cur);if(pe)pe.classList.add("done");completeSCORM();});
var lastSave=0;
function saveProgress(d){var now=Date.now();if(now-lastSave<5000)return;lastSave=now;
  try{localStorage.setItem(KEY,JSON.stringify({t:ap.currentTime,m:maxTime}));}catch(e){}
  if(scormAPI){try{scormAPI.SetValue("cmi.location",String(Math.floor(ap.currentTime)));scormAPI.SetValue("cmi.progress_measure",String(Math.min(1,maxTime/(d||1)).toFixed(3)));scormAPI.Commit("");}catch(e){}}
  if(d&&maxTime>=d*0.95)completeSCORM();
}
var scormAPI=null;
function findAPI(win){var a=0;while((win.API_1484_11==null)&&(win.parent!=null)&&(win.parent!=win)){a++;if(a>7)return null;win=win.parent;}return win.API_1484_11;}
function initSCORM(){scormAPI=findAPI(window);if(scormAPI){try{scormAPI.Initialize("");var st=scormAPI.GetValue("cmi.completion_status");if(st==="not attempted"||st==="unknown"||st===""){scormAPI.SetValue("cmi.completion_status","incomplete");scormAPI.Commit("");}var loc=parseFloat(scormAPI.GetValue("cmi.location"));if(loc>5)offerResume(loc);}catch(e){}}}
function completeSCORM(){if(scormAPI){try{if(scormAPI.GetValue("cmi.completion_status")!=="completed"){scormAPI.SetValue("cmi.completion_status","completed");scormAPI.SetValue("cmi.success_status","passed");scormAPI.SetValue("cmi.progress_measure","1");scormAPI.Commit("");}}catch(e){}}}
function restore(t){seekTo(t);setActive(indexAt(t));}
function offerResume(t){var b=document.getElementById("resume-btn");if(!b||!(t>5))return;b.textContent="↻ Kaldığınız yerden devam ("+fmt(t)+")";b.hidden=false;b.onclick=function(){restore(t);doPlay();b.hidden=true;};}
window.addEventListener("load",initSCORM);
window.addEventListener("beforeunload",function(){if(scormAPI){try{scormAPI.Terminate("");}catch(e){}}});
buildTOC();
ap.src=D.audio;
(function(){var t=0;try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.t){t=s.t;maxTime=s.m||0;}}catch(e){}
  document.getElementById("t-dur").textContent=fmt(D.total);
  setActive(0);if(t>5)offerResume(t);})();
</script>
</body>
</html>
